<body>
<header>
  <button class="thm" id="thm" aria-label="Theme">🌙 Dark</button>
  <h1>Oddable</h1>
  <div class="lg"><button data-lg="nfl">NFL</button><button data-lg="cfb">College</button></div>
  <select id="team" aria-label="Team"><option value="">All teams</option></select>
  <div class="sub" id="upd">Loading…</div>
  <div class="sub" style="font-size:11px;opacity:.7">Oddable v38 (violet)</div>
</header>
<main>
  <div id="livepage" hidden></div>
  <div class="rail" id="rail"></div><div class="dots" id="dots"></div>
  <div class="sums" id="sums"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>
<nav class="bn" id="bn"></nav>
<script src="model.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const pct = (x, d = 0) => (x * 100).toFixed(d) + '%';
const LG = (() => { try { return localStorage.getItem('pics-lg') === 'cfb' ? 'cfb' : 'nfl'; } catch (e) { return 'nfl'; } })();
const CFB = LG === 'cfb';
const SB = 'https://site.api.espn.com/apis/site/v2/sports/football/' + (CFB ? 'college-football' : 'nfl') + '/';
const SCX = CFB ? '&groups=80&limit=400' : ''; // FBS games only
const NWEEKS = CFB ? 15 : 18;
const NAMES = {}, RAT = {}, EFF = {}, TEAMID = {}, PL = {}, INJ = {};
// Settings from walk-forward backtests: college tuned on 2023-24 and confirmed on 2025 (1,884 games); NFL settings unchanged (no tuned set beat them on the 2025 hold-out)
const HFA = CFB ? 3.5 : 2.0, CAP = CFB ? 100 : 14, DECAY = CFB ? 0.95 : 0.85, RIDGE = CFB ? 1 : 6, MIXM = CFB ? 0.7 : 0.5, CARRY = CFB ? 1 : 0, RKW = CFB ? 1.3 : 0;
const PREV = {}; // last season's final power ratings (college), used as the starting point
const wgt = (g) => Math.pow(DECAY, Math.max(0, (CUR || g.week) - g.week)); // recent games count more
let INJ_AT = 0;
const ODDS_URL = 'https://calcutta-odds.onrender.com/odds';
const FIX = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' };
const PTS = 0.14;
const SD = CFB ? 16 : 13.5; // typical NFL scoring-margin spread around a game's expected margin
const cdf = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }; // logit points per point of margin (about 1 pt = 3.5% win prob near a pick'em)
const DET = {}; // remembers which week sections you opened or closed
const isOpen = (k, dflt) => (k in DET ? DET[k] : dflt);
let TEAM = (() => { try { return localStorage.getItem('pics-team-' + LG) || ''; } catch (e) { return ''; } })();
let LMOPEN = new Set(), LMMODE = 'day', LMBUSY = {};
let TD, LOTS, PAY, M, CUR = 0, ALL = {}, LAST = null, SPREAD = {}, BUSY = false, ODDS_AT = 0, ODDS_NOTE = '';

const ab = (x) => (CFB ? x : FIX[x] || x);
const logit = (x) => Math.log(x / (1 - x));
const spCache = (id) => { try { return JSON.parse(localStorage.getItem('st26-' + id)); } catch (e) { return null; } };
const spSave = (id, v) => { try { localStorage.setItem('st26-' + id, JSON.stringify(v)); } catch (e) {} };

// "SEA -3" / "EVEN" -> home-favored points (positive = home favored), or null
function parseLine(text, home, away) {
  if (!text) return null;
  if (/^(EVEN|PK|PICK)/i.test(text)) return 0;
  const m = /^([A-Z]{2,3})\s+(-?\d+(?:\.\d+)?)$/.exec(text.trim());
  if (!m) return null;
  const fav = ab(m[1]), v = Math.abs(+m[2]);
  return fav === home ? v : fav === away ? -v : null;
}

function parseEvents(j, week) {
  return (j.events || []).map((e) => {
    const c = e.competitions[0], t = e.status.type;
    const cs = c.competitors.map((x) => ({ abbr: ab(x.team.abbreviation), score: parseInt(x.score, 10) || 0, home: x.homeAway === 'home', record: (x.records && x.records[0] && x.records[0].summary) || '', color: x.team.color ? '#' + x.team.color : '', logo: x.team.logo || '', rank: x.curatedRank && x.curatedRank.current > 0 && x.curatedRank.current <= 25 ? x.curatedRank.current : 0 }));
    c.competitors.forEach((x) => { TEAMID[x.team.id] = ab(x.team.abbreviation); NAMES[ab(x.team.abbreviation)] = x.team.shortDisplayName || x.team.displayName || x.team.abbreviation; });
    cs.sort((a, b) => a.home - b.home);
    const o = c.odds && c.odds[0];
    return { id: e.id, week: week || (j.week && j.week.number) || 0, start: +new Date(e.date), state: t.state, detail: t.shortDetail || '', away: cs[0], home: cs[1], neutral: !!c.neutralSite, line: o ? parseLine(o.details, cs[1].abbr, cs[0].abbr) : null, sit: c.situation ? { down: c.situation.down, dist: c.situation.distance, yl: c.situation.yardLine, poss: TEAMID[c.situation.possession] || '', text: (c.situation.lastPlay && c.situation.lastPlay.text) || '', ptxt: c.situation.downDistanceText || '', rz: !!c.situation.isRedZone, wp: c.situation.lastPlay && c.situation.lastPlay.probability && Number.isFinite(c.situation.lastPlay.probability.homeWinPercentage) ? c.situation.lastPlay.probability.homeWinPercentage : null } : null };
  });
}

// ---- Line movement: ESPN gives the opening and current line; we log every change we see on this device ----
const lmKey = (id) => 'lm26-' + id;
const LINES_URL = 'https://raw.githubusercontent.com/WSS5480/CALCUTTA/lines-data/lines.json'; // logged around the clock by a GitHub Action
let SERVER_LM = {};
function lmLocal(id) { try { return JSON.parse(localStorage.getItem(lmKey(id))) || []; } catch (e) { return []; } }
function lmLoad(id) { return [...(SERVER_LM[id] || []), ...lmLocal(id)].sort((a, b) => a[0] - b[0]); }
async function loadServerLines() {
  if (CFB) return;
  const merged = {};
  const add = (db) => Object.keys(db || {}).forEach((id) => { merged[id] = [...(merged[id] || []), ...db[id]]; });
  try { const r = await fetch(LINES_URL, { cache: 'no-store' }); if (r.ok) add(await r.json()); } catch (e) {}
  try { const r = await fetch('https://calcutta-odds.onrender.com/lines', { cache: 'no-store' }); if (r.ok) add(await r.json()); } catch (e) {}
  Object.keys(merged).forEach((id) => merged[id].sort((a, b) => a[0] - b[0]));
  SERVER_LM = merged; render();
}
function lmRecord(g) {
  if (g.line === null || g.state === 'post') return;
  const a = lmLocal(g.id), last = a[a.length - 1], now = Date.now();
  if (!last || last[1] !== g.line || now - last[0] > 60 * 60 * 1000) {
    a.push([now, g.line]);
    try { localStorage.setItem(lmKey(g.id), JSON.stringify(a.slice(-400))); } catch (e) {}
  }
}
const openKey = (id) => 'lo26-' + id;
function lmOpen(id) { try { const v = localStorage.getItem(openKey(id)); return v === null ? null : +v; } catch (e) { return null; } }
async function lmFetchOpen(g) {
  if (lmOpen(g.id) !== null || LMBUSY[g.id]) return;
  LMBUSY[g.id] = true;
  try {
    const s = await getJson(SB + 'summary?event=' + g.id);
    const ps = ((s.pickcenter || [])[0] || {}).pointSpread;
    const raw = ps && ps.home && ps.home.open && ps.home.open.line;
    const n = raw === 'EVEN' || raw === 'PK' ? 0 : parseFloat(raw);
    if (Number.isFinite(n)) { try { localStorage.setItem(openKey(g.id), String(-n)); } catch (e) {} }
  } catch (e) {}
  LMBUSY[g.id] = false;
}
// Open lines for the next few weeks so the "Line moves" board can rank movers
async function fillOpens() {
  const todo = Object.values(ALL).filter((g) => g.state !== 'post' && g.line !== null && g.week <= CUR + 2 && lmOpen(g.id) === null);
  let i = 0;
  const worker = async () => { while (i < todo.length) { await lmFetchOpen(todo[i++]); } };

  const field = x === null ? '' : `<div class="fld"><span class="ez" style="background:${g.away.color || '#1d4ed8'}">${g.away.abbr}</span><div class="yd"><i style="left:${x}%"></i></div><span class="ez" style="background:${g.home.color || '#7c3aed'}">${g.home.abbr}</span></div>`;
  return `<div class="lv" data-lv="${g.id}">
    <div class="lvh"><div class="lvt"><b>${rk(g.away)}${g.away.abbr}</b>${pre ? '' : `<em>${g.away.score}</em>`}</div><div class="lvm">${pre ? `<b>${new Date(g.start).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</b><small>Kickoff</small>` : post ? '<b>FINAL</b>' : `${liveTag(g)}<small>${g.detail}</small>`}</div><div class="lvt">${pre ? '' : `<em>${g.home.score}</em>`}<b>${rk(g.home)}${g.home.abbr}</b></div></div>
    ${dd ? `<div class="lvd">${dd}${s.poss ? ' · ' + s.poss + ' ball' : ''}${s.rz ? ' · red zone' : ''}</div>` : ''}${field}
    ${s && s.text ? `<div class="lvp">${s.text}</div>` : ''}
    ${arr ? wpChart(g, arr) : '<div class="sub">Loading win probability…</div>'}
    <div class="sub">${pre ? 'Our win chance (model + line) · the live chart fills in at kickoff' : (post ? 'Win chance through the game (ESPN)' : 'Live win chance from ESPN') + ' · our pregame pick ' + p.su.abbr + ' ' + pct(p.conf)}</div>
  </div>`;
}
function card(g) {
  const p = pred(g);
  const when = g.state === 'in' ? `${liveTag(g)} ${g.detail} · ${g.away.abbr} ${g.away.score} – ${g.home.abbr} ${g.home.score}`
    : `<b>${new Date(g.start).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</b>`;
  const ats = p.ats ? `<div>Spread pick: <b>${p.ats.side.abbr} ${sp(p.ats.line)}</b> · covers <b>${pct(p.ats.cover)}</b> <span class="sub">(model: ${byText(g, p.mh)} · line: ${byText(g, g.line)})</span></div>` : '<div class="sub">No spread posted yet</div>';
  return `<div class="card ${g.state === 'in' ? 'live' : ''}">
    ${liveView(g)}
    <div class="gstat"><span>${when}</span><span>${lineText(g)}</span></div>
    <div class="row"><b>${rk(g.away)}${nm(g.away.abbr)} <small>${g.away.record}</small></b><b>${pct(p.pa)}</b></div>
    <div class="bar"><i style="width:${p.pa * 100}%"></i></div>
    <div class="row"><b>${rk(g.home)}${nm(g.home.abbr)} <small>${g.home.record} · home</small></b><b>${pct(p.ph)}</b></div>
    <div class="pick"><div>Pick: <b>${nm(p.su.abbr)}</b> ${pct(p.conf)}${p.mkt ? ' <span class="sub">(model + line)</span>' : ''}</div>${ats}</div>
    ${p.inj ? `<div class="sub">🩹 Starters hurt (info only): ${[['a', g.away], ['h', g.home]].filter(([k]) => p.inj[k].pts).map(([k, t]) => `${t.abbr} −${p.inj[k].pts.toFixed(1)} (${p.inj[k].list.join(', ')})`).join(' · ')}</div>` : ''}
    ${lmBlock(g)}
  </div>`;
}

// Expected record for a slate: sum of win chances (straight up) and cover chances (spread)
function projText(gs) {
  let su = 0, ats = 0, an = 0;
  gs.forEach((g) => { const p = pred(g); su += p.conf; if (p.ats) { ats += p.ats.cover; an++; } });
  const f = (w, n) => w.toFixed(1) + '-' + (n - w).toFixed(1);
  return `${f(su, gs.length)}${an ? ' · spread ' + f(ats, an) : ''}`;
}
function proj(gs) { return `<div class="note">Predicted record: <b>${projText(gs)}</b> (win picks · against the spread)</div>`; }

function teamSelect() {
  const set = new Set(); Object.values(ALL).forEach((g) => { set.add(g.home.abbr); set.add(g.away.abbr); });
  const arr = [...set].sort((a, b) => nm(a).localeCompare(nm(b))), sel = $('#team');
  if (sel.dataset.n !== String(arr.length)) { sel.innerHTML = '<option value="">All teams</option>' + arr.map((a) => `<option value="${a}">${nm(a)}</option>`).join(''); sel.dataset.n = arr.length; sel.value = TEAM; }
}
// Stats card for the selected team: record, scoring, how it did against the spread, and how our picks did on its games
function teamBox(games) {
  if (!TEAM) return '';
  const fin = games.filter((g) => g.state === 'post' && g.home.score !== g.away.score);
  let w = 0, l = 0, pf = 0, pa = 0, cw = 0, cl = 0, cp = 0, hw = 0, hl = 0, aw = 0, al = 0, pkH = 0, pkN = 0, atH = 0, atN = 0;
  fin.forEach((g) => {
    const home = g.home.abbr === TEAM, me = home ? g.home : g.away, op = home ? g.away : g.home, m = me.score - op.score;
    pf += me.score; pa += op.score;
    if (m > 0) { w++; if (home) hw++; else aw++; } else { l++; if (home) hl++; else al++; }
    if (g.line !== null) { const c = m + (home ? -g.line : g.line) ; if (c > 0) cw++; else if (c < 0) cl++; else cp++; } // line is home-favored points
    const r = grade(g); if (r) { pkN++; if (r.suHit) pkH++; if (r.atsRes === 'hit' || r.atsRes === 'miss') { atN++; if (r.atsRes === 'hit') atH++; } }
  });
  const n = fin.length, avg = n ? ((pf - pa) / n).toFixed(1) : '–';
  const nxt = games.filter((g) => g.state !== 'post').sort((a, b) => a.start - b.start)[0];
  const rec = Object.values(ALL).map((g) => (g.home.abbr === TEAM ? g.home : g.away.abbr === TEAM ? g.away : null)).filter(Boolean).find((t) => t.record);
  const rating = RAT[TEAM] !== undefined ? ` · power rating ${sp(+RAT[TEAM].toFixed(1))}${EFF[TEAM] !== undefined ? ` · efficiency ${sp(+EFF[TEAM].toFixed(1))}` : ''}` : '';
  const tile = (b, lab, sm) => `<div class="sum"><b>${b}</b><span>${lab}</span><small>${sm}</small></div>`;
  return `<div class="gh">${nm(TEAM)}${rec ? ' · ' + rec.record : ''}</div><div class="sums">
    ${tile(`${w}-${l}`, 'Record (finals)', `Home ${hw}-${hl} · Away ${aw}-${al}`)}
    ${tile(cw + cl ? pct(cw / (cw + cl), 0) : '–', 'Covers the spread', `${cw}-${cl}${cp ? '-' + cp : ''} ATS`)}
    ${tile(avg, 'Avg margin', `${n ? (pf / n).toFixed(1) : '–'} for · ${n ? (pa / n).toFixed(1) : '–'} against`)}
    ${tile(pkN ? pct(pkH / pkN, 0) : '–', 'Our win picks', `${pkH}-${pkN - pkH}${atN ? ` · spread picks ${atH}-${atN - atH}` : ''}`)}
  </div>${leadersHtml(TEAM)}${nxt ? `<div class="note">Next: <b>${nxt.away.abbr} @ ${nxt.home.abbr}</b> · ${new Date(nxt.start).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}${nxt.line !== null ? ' · ' + lineText(nxt) : ''}${rating}</div>` : rating ? `<div class="note">${rating.slice(3)}</div>` : ''}`;
}

function render() {
  const y = window.scrollY;
  renderInner();
  if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
}
function renderInner() {
  if (!M) return;
  buildRatings(); buildEff(); if (!CFB) buildPlayers();
  // ESPN drops the pregame line once a game starts; keep the last line we logged so live games stay in the line-move board and picks
  Object.values(ALL).forEach((g) => { if (g.line === null && g.state === 'in') { const r = lmLoad(g.id); if (r.length) g.line = r[r.length - 1][1]; else { const k = lkLoad(g.id); if (k && k.L !== null && k.L !== undefined) g.line = k.L; } } });
  Object.values(ALL).forEach(lockSnap);
  const games = TEAM ? Object.values(ALL).filter((g) => g.home.abbr === TEAM || g.away.abbr === TEAM) : Object.values(ALL);
  teamSelect();
  const live = games.filter((g) => g.state === 'in');
  const pre = games.filter((g) => g.state === 'pre');
  const post = games.filter((g) => g.state === 'post');
  const thisWeek = [...live, ...pre.filter((g) => g.week === CUR)];
  const future = {};
  pre.filter((g) => g.week > CUR).forEach((g) => (future[g.week] = future[g.week] || []).push(g));

  // Results
  let SH = 0, ST = 0, AH = 0, AM = 0, AP = 0, HH = 0, HT = 0, LSH = 0, LST = 0, LAH = 0, LAM = 0;
  const byWeek = {};
  post.forEach((g) => (byWeek[g.week] = byWeek[g.week] || []).push(g));
  const weeks = Object.keys(byWeek).map(Number).sort((a, b) => b - a).map((n) => {
    let h = 0, t = 0, ah = 0, am = 0, ap = 0;
    const rows = byWeek[n].map((g) => {
      const r = grade(g); if (!r) return '';
      t++; ST++; if (r.suHit) { h++; SH++; }
      if (r.p.conf >= 0.65) { HT++; if (r.suHit) HH++; }
      if (r.lk) { LST++; if (r.lsu) LSH++; if (r.lats === 'hit') LAH++; else if (r.lats === 'miss') LAM++; }
      if (r.atsRes === 'hit') { ah++; AH++; } else if (r.atsRes === 'miss') { am++; AM++; } else if (r.atsRes === 'push') { ap++; AP++; }
      const bad = (cls, txt) => `<span class="b ${cls}">${txt}</span>`;
      const b1 = bad(r.suHit ? 'hit' : 'miss', r.suHit ? '✓ Win pick' : '✗ Win pick');
      const b2 = r.atsRes ? bad(r.atsRes, (r.atsRes === 'hit' ? '✓' : r.atsRes === 'miss' ? '✗' : '–') + ' Spread') : '';
      return `<details data-k="g${g.id}" ${isOpen('g' + g.id, false) ? 'open' : ''} class="res ${r.suHit ? 'hit' : 'miss'}"><summary><div class="rtop"><div><b>${g.away.abbr} ${g.away.score} – ${g.home.abbr} ${g.home.score}</b><small>Pick ${r.p.su.abbr} ${pct(r.p.conf)}${r.p.ats ? ` · lean ${r.p.ats.side.abbr} ${sp(r.p.ats.line)}` : ''}</small></div><div class="badges">${b1}${b2}${r.lk ? `<span class="b ${r.lsu ? 'hit' : 'miss'}">🔒 ${r.lsu ? '✓' : '✗'}${r.lats ? ' / ' + (r.lats === 'hit' ? '✓' : r.lats === 'miss' ? '✗' : '–') : ''} Locked</span>` : ''}</div></div></summary>${resDetail(g, r)}${lmBlock(g)}</details>`;
    }).join('');
    return { n, h, t, ah, am, ap, rows };
  });
  const atsN = AH + AM;
  $('#sums').innerHTML = `
    <div class="sum"><b>${ST ? pct(SH / ST, 1) : '–'}</b><span>Win picks (backtest)</span><small>${SH}-${ST - SH}${HT ? ` · 65%+ picks ${HH}-${HT - HH}` : ''}</small></div>
    <div class="sum"><b>${atsN ? pct(AH / atsN, 1) : '–'}</b><span>Spread (backtest)</span><small>${AH}-${AM}${AP ? '-' + AP : ''}${atsN ? '' : ' (loading lines…)'}</small></div>`;

  $('#sums').innerHTML += `
    <div class="sum lock"><b>${LST ? pct(LSH / LST, 1) : '–'}</b><span>🔒 Locked win picks</span><small>${LST ? LSH + '-' + (LST - LSH) : 'counts games picked before kickoff'}</small></div>
    <div class="sum lock"><b>${LAH + LAM ? pct(LAH / (LAH + LAM), 1) : '–'}</b><span>🔒 Locked spread</span><small>${LAH + LAM ? LAH + '-' + LAM : 'starts with the next finished game'}</small></div>`;
  railRender(games, thisWeek); livePageRender(games); navRender();
  $('#list').innerHTML = teamBox(games) + (TEAM ? '' : weekBoard([...thisWeek, ...post.filter((g) => g.week === CUR)]) + titleBoard()) + movesBoard(games) +
    (thisWeek.length ? '<div class="gh">This week</div>' + proj(thisWeek) + (TEAM ? thisWeek.map(card).join('') : '') : (TEAM ? '' : '<div class="note">No more games left this week.</div>')) +
    (Object.keys(future).length ? '<div class="gh">Rest of season</div>' + Object.keys(future).map(Number).sort((a, b) => a - b).map((n) => `<details data-k="f${n}" ${isOpen('f' + n, n === CUR + 1) ? 'open' : ''}><summary>Week ${n}: ${future[n].length} games · exp ${projText(future[n])}</summary>${future[n].map(card).join('')}</details>`).join('') : '') +
    (weeks.length ? '<div class="gh">Results</div>' + weeks.map((w) => `<details data-k="r${w.n}" ${isOpen('r' + w.n, w.n === CUR) ? 'open' : ''}><summary>Week ${w.n}: ${w.h}-${w.t - w.h} picks · spread ${w.ah}-${w.am}${w.ap ? '-' + w.ap : ''}</summary>${w.rows}</details>`).join('') : '');
  const liveN = live.length;
  $('#upd').innerHTML = `<span class="dot ${liveN ? 'on' : ''}"></span>${liveN ? liveN + ' live · ' : ''}updated ${LAST ? LAST.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '…'}`;
  $('#foot').innerHTML = CFB ? 'College football (FBS). Strength is a power rating built from every final this season (blowouts capped at 28, home edge removed) and pulled toward the AP Top 25 rank early on, so it updates after each game. Win chance blends that with the current spread; spread lean compares the model margin with the line. Past games are graded with today\'s ratings, so record is flattering. Line movement logs from the day you first open a game.' : `Starters hurt (ESPN report) are listed for information only. The team model uses this season's score margins and efficiency (yards per play, turnovers) plus home field, then blends with the current spread, so it shifts when the line moves. Spread lean compares the model's expected margin with the DraftKings line (closing line for past games). Past games are graded with today's ratings, so records flatter the model and are not what it would have said before kickoff. ${ODDS_NOTE}`;
}

async function loadOdds() {
  if (CFB || !M || Date.now() - ODDS_AT < 10 * 60 * 1000) return;
  ODDS_AT = Date.now();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 70000);
    const j = await (await fetch(ODDS_URL, { signal: ctl.signal })).json(); clearTimeout(to);
    if (!j.odds) throw new Error();
    TD.teams.forEach((t) => { if (Number.isFinite(j.odds[t.abbr])) t.sbOdds = j.odds[t.abbr]; });
    M = Calcutta.compute(TD, LOTS, PAY);
    ODDS_NOTE = 'Super Bowl odds: ' + (j.book || '') + ' via The Odds API, ' + new Date(j.updated).toLocaleString() + '.';
    render();
  } catch (e) { ODDS_AT = Date.now() - 8 * 60 * 1000; }
}

async function tick() {
  clearTimeout(window.__t);
  try {
    const j = await getJson(SB + 'scoreboard' + (CFB ? '?' + SCX.slice(1) : ''));
    CUR = (j.week && j.week.number) || CUR;
    merge(parseEvents(j, CUR));
    LAST = new Date();
    render();
    liveFetch();
  } catch (e) { $('#upd').textContent = 'Live scores unavailable · retrying'; }
  const g = Object.values(ALL);
  const hot = g.some((x) => x.state === 'in') || g.some((x) => x.state === 'pre' && x.start - Date.now() < 20 * 60 * 1000 && x.start - Date.now() > -3600e3);
  window.__t = setTimeout(tick, hot ? 60000 : 300000);
}

async function loadAll() {
  if (BUSY) return; BUSY = true;
  try {
    if (CFB) M = { by: {} };
    else { const [t, l, p] = await Promise.all(['teams', 'lots', 'payouts'].map((n) => getJson('data/' + n + '.json?v=' + Date.now()))); TD = t; LOTS = l; PAY = p; M = Calcutta.compute(t, l, p); }
    await loadPrior();
    await tick();
    const wk = []; for (let n = CFB ? 0 : 1; n <= NWEEKS; n++) wk.push(n);
    let i = 0;
    const w = async () => { while (i < wk.length) { const n = wk[i++]; try { await loadWeek(n); } catch (e) {} render(); } };
    await Promise.all([w(), w(), w()]);
    render();
    loadOdds();
    await fillSpreads(); render(); loadInjuries();
    await fillOpens(); render();
    loadServerLines();
  } catch (e) { $('#upd').textContent = 'Could not load: ' + e.message; }
  BUSY = false;
}
document.addEventListener('toggle', (e) => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.k) { DET[d.dataset.k] = d.open; if (d.open && /^(wk|g\d)/.test(d.dataset.k)) liveFetch(); } }, true);
document.querySelector('#team').addEventListener('change', (e) => { TEAM = e.target.value; try { localStorage.setItem('pics-team-' + LG, TEAM); } catch (x) {} render(); });
document.querySelectorAll('.lg button').forEach((b) => { if (b.dataset.lg === LG) b.classList.add('on'); });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-lg]'); if (!b || b.dataset.lg === LG) return; try { localStorage.setItem('pics-lg', b.dataset.lg); } catch (x) {} location.reload(); });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-lm],[data-lmmode]');
  if (!b) return;
  if (b.dataset.lmmode) { LMMODE = b.dataset.lmmode; return render(); }
  const id = b.dataset.lm;
  if (LMOPEN.has(id)) LMOPEN.delete(id); else { LMOPEN.add(id); render(); await lmFetchOpen(ALL[id]); }
  render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && M) { tick(); loadOdds(); } });
setInterval(() => { if (M) { loadInjuries(); loadWeek(CUR + 1).then(render).catch(() => {}); fillSpreads().then(render); fillOpens().then(render); loadServerLines(); } }, 30 * 60 * 1000);
loadAll();

if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update().catch(() => {})).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl) { rl = true; location.reload(); } });
}

// Pull down to refresh: wipes the saved app copy and reloads fresh code and data
(function () {
  const bar = document.createElement('div'); bar.id = 'ptr'; document.body.appendChild(bar);
  let y0 = null, d = 0, busy = false;
  const set = (h, t) => { bar.style.height = h + 'px'; bar.textContent = t || ''; };
  window.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && !busy ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (d > 0 && window.scrollY <= 0) set(Math.min(d * 0.5, 70), d > 110 ? 'Release to refresh' : '↓ Pull to refresh'); else set(0);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = d > 110; y0 = null;
    if (!go) return set(0);
    busy = true; set(44, 'Refreshing…');
    try {
      // Refresh data in place (keeps scroll, open weeks, league and team); only reload if a newer app version is out
      const t = await (await fetch('index.html', { cache: 'no-store' })).text();
      const ver = (x) => (/Pics v\d+/.exec(x) || [''])[0];
      if (ver(t) && ver(t) !== ver(document.querySelector('header').innerText)) {
        if ('serviceWorker' in navigator) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
        if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
        const u = new URL(location.href); u.searchParams.set('r', Date.now()); return location.replace(u.toString());
      }
      await tick();
      for (let n = CUR; n <= NWEEKS; n++) { try { await loadWeek(n); } catch (e) {} }
      render();
      await fillSpreads(); render(); loadServerLines(); loadOdds(); INJ_AT = 0; loadInjuries();
    } catch (e) {}
    busy = false; set(0);
  });
})();
</script>
</body>
