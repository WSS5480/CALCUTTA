<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steve's Pics</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#bf5700">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf5ef;--panel:#fff;--panel2:#f6e8da;--line:#e6d3bf;--ink:#2b2b2b;--muted:#6e6259;--blue:#bf5700;--green:#16915a;--red:#d93a2e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header,main{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:max(16px,env(safe-area-inset-top))}
h1{margin:8px 0 2px;font-size:28px}
.sub{color:var(--muted);font-size:13px}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum b{display:block;font-size:26px}.sum span{color:var(--muted);font-size:13px}.sum small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gh{margin:20px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.live{border-color:var(--blue)}
.gstat{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0}.row small{color:var(--muted);font-weight:400}
.bar{height:10px;border-radius:8px;background:var(--panel2);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--blue)}
.pick{margin-top:8px;padding:8px 10px;background:var(--panel2);border-radius:10px;font-size:14px}
.pick div+div{margin-top:3px}
.tag{font-weight:700;white-space:nowrap}.hit{color:var(--green)}.miss{color:var(--red)}.push{color:var(--muted)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res{padding:9px 12px;margin:6px 0;border-radius:10px;border:1px solid;background:var(--panel)}
.res small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.res .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.b.hit{background:#16915a1f;border-color:var(--green)}.b.miss{background:#d93a2e1f;border-color:var(--red)}.b.push{background:#6e625922;border-color:var(--muted)}
.res.hit{border-color:var(--green);background:#16915a14}.res.miss{border-color:var(--red);background:#d93a2e14}
details>summary{cursor:pointer;list-style:none;padding:10px 12px;background:var(--panel2);border-radius:10px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'▾';color:var(--blue)}details[open]>summary::after{transform:rotate(180deg)}
.note{color:var(--muted);font-size:13px;margin:8px 0}
.foot{color:var(--muted);font-size:12px;margin-top:20px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}.dot.on{background:var(--red)}
.lmbtn{margin-top:8px;background:none;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:5px 12px;font:600 13px inherit;cursor:pointer}
.lm{margin-top:8px;padding:10px;background:var(--panel2);border-radius:10px}
.lm .tg{display:flex;gap:6px;margin-bottom:6px}.lm .tg button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:3px 10px;font:600 12px inherit;cursor:pointer}.lm .tg button.on{background:var(--blue);color:#fff}
.lm svg{width:100%;height:auto;display:block}.lm .cap{font-size:12px;color:var(--muted);margin-top:4px}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--muted);font-size:13px;line-height:44px;background:var(--bg);position:fixed;top:0;left:0;right:0;z-index:40;transition:height .15s}

.lg{display:flex;gap:8px;margin:6px 0}.lg button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:6px 16px;font:700 14px inherit;cursor:pointer}.lg button.on{background:var(--blue);color:#fff}
select#team{width:100%;max-width:320px;margin:2px 0 6px;padding:9px 12px;border:1px solid var(--blue);border-radius:12px;background:#fff;color:var(--ink);font:600 15px inherit}
.sum.lock{border-color:#bf5700;background:#fdf1e6}
body{border-top:6px solid #bf5700}h1{color:#bf5700}
</style>
</head>
<body>
<header>
  <h1>Steve's Pics</h1>
  <div class="lg"><button data-lg="nfl">NFL</button><button data-lg="cfb">College</button></div>
  <select id="team" aria-label="Team"><option value="">All teams</option></select>
  <div class="sub" id="upd">Loading…</div>
  <div class="sub" style="font-size:11px;opacity:.7">Pics v19 (team model)</div>
</header>
<main>
  <div class="sums" id="sums"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>
<script src="model.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const pct = (x, d = 0) => (x * 100).toFixed(d) + '%';
const LG = (() => { try { return localStorage.getItem('pics-lg') === 'cfb' ? 'cfb' : 'nfl'; } catch (e) { return 'nfl'; } })();
const CFB = LG === 'cfb';
const SB = 'https://site.api.espn.com/apis/site/v2/sports/football/' + (CFB ? 'college-football' : 'nfl') + '/';
const SCX = CFB ? '&groups=80&limit=400' : ''; // FBS games only
const NWEEKS = CFB ? 15 : 18;
const NAMES = {}, RAT = {}, EFF = {}, TEAMID = {}, PL = {}, INJ = {};
const HFA = CFB ? 2.5 : 2.0, CAP = CFB ? 28 : 24;
let INJ_AT = 0;
const ODDS_URL = 'https://calcutta-odds.onrender.com/odds';
const FIX = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' };
const PTS = 0.14;
const SD = CFB ? 16 : 13.5; // typical NFL scoring-margin spread around a game's expected margin
const cdf = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }; // logit points per point of margin (about 1 pt = 3.5% win prob near a pick'em)
const DET = {}; // remembers which week sections you opened or closed
const isOpen = (k, dflt) => (k in DET ? DET[k] : dflt);
let TEAM = (() => { try { return localStorage.getItem('pics-team-' + LG) || ''; } catch (e) { return ''; } })();
let LMOPEN = new Set(), LMMODE = 'day', LMBUSY = {};
let TD, LOTS, PAY, M, CUR = 0, ALL = {}, LAST = null, SPREAD = {}, BUSY = false, ODDS_AT = 0, ODDS_NOTE = '';

const ab = (x) => (CFB ? x : FIX[x] || x);
const logit = (x) => Math.log(x / (1 - x));
const spCache = (id) => { try { return JSON.parse(localStorage.getItem('sr26-' + id)); } catch (e) { return null; } };
const spSave = (id, v) => { try { localStorage.setItem('sr26-' + id, JSON.stringify(v)); } catch (e) {} };

// "SEA -3" / "EVEN" -> home-favored points (positive = home favored), or null
function parseLine(text, home, away) {
  if (!text) return null;
  if (/^(EVEN|PK|PICK)/i.test(text)) return 0;
  const m = /^([A-Z]{2,3})\s+(-?\d+(?:\.\d+)?)$/.exec(text.trim());
  if (!m) return null;
  const fav = ab(m[1]), v = Math.abs(+m[2]);
  return fav === home ? v : fav === away ? -v : null;
}

function parseEvents(j, week) {
  return (j.events || []).map((e) => {
    const c = e.competitions[0], t = e.status.type;
    const cs = c.competitors.map((x) => ({ abbr: ab(x.team.abbreviation), score: parseInt(x.score, 10) || 0, home: x.homeAway === 'home', record: (x.records && x.records[0] && x.records[0].summary) || '', rank: x.curatedRank && x.curatedRank.current > 0 && x.curatedRank.current <= 25 ? x.curatedRank.current : 0 }));
    c.competitors.forEach((x) => { TEAMID[x.team.id] = ab(x.team.abbreviation); NAMES[ab(x.team.abbreviation)] = x.team.shortDisplayName || x.team.displayName || x.team.abbreviation; });
    cs.sort((a, b) => a.home - b.home);
    const o = c.odds && c.odds[0];
    return { id: e.id, week: week || (j.week && j.week.number) || 0, start: +new Date(e.date), state: t.state, detail: t.shortDetail || '', away: cs[0], home: cs[1], neutral: !!c.neutralSite, line: o ? parseLine(o.details, cs[1].abbr, cs[0].abbr) : null };
  });
}

// ---- Line movement: ESPN gives the opening and current line; we log every change we see on this device ----
const lmKey = (id) => 'lm26-' + id;
const LINES_URL = 'https://raw.githubusercontent.com/WSS5480/CALCUTTA/lines-data/lines.json'; // logged around the clock by a GitHub Action
let SERVER_LM = {};
function lmLocal(id) { try { return JSON.parse(localStorage.getItem(lmKey(id))) || []; } catch (e) { return []; } }
function lmLoad(id) { return [...(SERVER_LM[id] || []), ...lmLocal(id)].sort((a, b) => a[0] - b[0]); }
async function loadServerLines() {
  if (CFB) return;
  const merged = {};
  const add = (db) => Object.keys(db || {}).forEach((id) => { merged[id] = [...(merged[id] || []), ...db[id]]; });
  try { const r = await fetch(LINES_URL, { cache: 'no-store' }); if (r.ok) add(await r.json()); } catch (e) {}
  try { const r = await fetch('https://calcutta-odds.onrender.com/lines', { cache: 'no-store' }); if (r.ok) add(await r.json()); } catch (e) {}
  Object.keys(merged).forEach((id) => merged[id].sort((a, b) => a[0] - b[0]));
  SERVER_LM = merged; render();
}
function lmRecord(g) {
  if (g.line === null || g.state === 'post') return;
  const a = lmLocal(g.id), last = a[a.length - 1], now = Date.now();
  if (!last || last[1] !== g.line || now - last[0] > 60 * 60 * 1000) {
    a.push([now, g.line]);
    try { localStorage.setItem(lmKey(g.id), JSON.stringify(a.slice(-400))); } catch (e) {}
  }
}
const openKey = (id) => 'lo26-' + id;
function lmOpen(id) { try { const v = localStorage.getItem(openKey(id)); return v === null ? null : +v; } catch (e) { return null; } }
async function lmFetchOpen(g) {
  if (lmOpen(g.id) !== null || LMBUSY[g.id]) return;
  LMBUSY[g.id] = true;
  try {
    const s = await getJson(SB + 'summary?event=' + g.id);
    const ps = ((s.pickcenter || [])[0] || {}).pointSpread;
    const raw = ps && ps.home && ps.home.open && ps.home.open.line;
    const n = raw === 'EVEN' || raw === 'PK' ? 0 : parseFloat(raw);
    if (Number.isFinite(n)) { try { localStorage.setItem(openKey(g.id), String(-n)); } catch (e) {} }
  } catch (e) {}
  LMBUSY[g.id] = false;
}
// Open lines for the next few weeks so the "Line moves" board can rank movers
async function fillOpens() {
  const todo = Object.values(ALL).filter((g) => g.state !== 'post' && g.line !== null && g.week <= CUR + 2 && lmOpen(g.id) === null);
  let i = 0;
  const worker = async () => { while (i < todo.length) { await lmFetchOpen(todo[i++]); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
}
function movesBoard(games) {
  const mv = games.filter((g) => g.state !== 'post' && g.line !== null && lmOpen(g.id) !== null)
    .map((g) => ({ g, d: g.line - lmOpen(g.id) })) // + = moved toward home
    .filter((x) => Math.abs(x.d) >= 1).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 8);
  if (!mv.length) return '';
  const fmt = (g, L) => (L === 0 ? 'Pick ’em' : `${(L > 0 ? g.home : g.away).abbr} -${Math.abs(L)}`);
  return '<div class="gh">Biggest line moves</div>' + mv.map(({ g, d }) => `<div class="card"><div class="gstat"><span>Week ${g.week} · ${new Date(g.start).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span><span>${Math.abs(d)} pts</span></div>
    <div class="row"><b>${g.away.abbr} @ ${g.home.abbr}</b><b>${fmt(g, lmOpen(g.id))} → ${fmt(g, g.line)}</b></div>
    <div class="sub">Moved toward ${d > 0 ? nm(g.home.abbr) : nm(g.away.abbr)}</div></div>`).join('');
}

// By-day view: one slot per weekday leading up to kickoff; each slot shows the line as of the end of that day (carried forward when it didn't move)
function lmDayChart(g) {
  const DAY = 864e5, sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; };
  const gd = sod(g.start), today = sod(Date.now()), done = g.state === 'post';
  const startD = done || (gd - today) <= 6 * DAY ? new Date(gd) : new Date(today);
  if (done || (gd - today) <= 6 * DAY) startD.setDate(startD.getDate() - 6);
  const slots = [];
  for (let i = 0; i < 7; i++) { const d = new Date(startD); d.setDate(d.getDate() + i); slots.push(d); }
  const raw = lmLoad(g.id), o = lmOpen(g.id);
  const vals = slots.map((d) => {
    if (!done && d > today) return null;
    const end = new Date(d); end.setDate(end.getDate() + 1);
    let L = null;
    raw.forEach(([t, v]) => { if (t < +end) L = v; });
    if (L === null) L = o !== null ? o : null;
    if (done && +d === +gd && g.line !== null) L = g.line;
    if (L === null && +d === +today && g.line !== null) L = g.line;
    return L === null ? null : -L; // home-team spread
  });
  const have = vals.filter((v) => v !== null);
  if (!have.length) return '<div class="cap">No line yet.</div>';
  const lo = Math.min(...have) - 0.5, hi = Math.max(...have) + 0.5, W = 300, H = 100, pad = 20;
  const x = (i) => pad + (i * (W - 2 * pad)) / 6;
  const y = (v) => 14 + (hi - v) * (H - 38) / (hi - lo || 1);
  let path = '', dots = '';
  vals.forEach((v, i) => {
    if (v === null) return;
    path += `${path ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#bf5700"/><text x="${x(i).toFixed(1)}" y="${(y(v) - 6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#2b2b2b">${sp(v)}</text>`;
  });
  const xl = slots.map((d, i) => `<text x="${x(i).toFixed(1)}" y="${H - 2}" font-size="8" text-anchor="middle" fill="${+d === +gd ? '#bf5700' : '#6e6259'}" ${+d === +gd ? 'font-weight="700"' : ''}>${d.toLocaleDateString([], { weekday: 'short' })}${+d === +gd ? ' ⚑' : ''}</text>`).join('');
  const first = have[0], last = have[have.length - 1], moved = last - first;
  const note = moved === 0 ? 'No move across these days' : `Moved ${Math.abs(moved)} pts toward ${moved < 0 ? g.home.abbr : g.away.abbr} (${sp(first)} → ${sp(last)})`;
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="#bf5700" stroke-width="2"/>${dots}${xl}</svg><div class="cap">${g.home.abbr} spread by day · ${note}.${done ? ` Final: ${g.away.abbr} ${g.away.score}, ${g.home.abbr} ${g.home.score}.` : ' ⚑ = game day. Days before we started tracking show the opening line.'}</div>`;
}
function lmChart(g) {
  if (LMMODE === 'day') return lmDayChart(g);
  const pts = [];
  const o = lmOpen(g.id);
  if (o !== null) pts.push({ t: 0, L: o, label: 'Open' });
  const raw = lmLoad(g.id);
  const buckets = {};
  raw.forEach(([t, L]) => {
    const d = new Date(t);
    const k = LMMODE === 'hour' ? Math.floor(t / 3600e3) : d.toDateString();
    buckets[k] = { t, L, label: LMMODE === 'hour' ? d.toLocaleTimeString([], { weekday: 'short', hour: 'numeric' }) : d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' }) };
  });
  Object.values(buckets).sort((a, b) => a.t - b.t).forEach((b) => pts.push(b));
  if (g.state === 'post' && g.line !== null) {
    const last = pts[pts.length - 1];
    if (last && last.L === g.line && pts.length > 1) last.label = 'Close';
    else pts.push({ t: Infinity, L: g.line, label: 'Close' });
  }
  if (!pts.length) return '<div class="cap">No line yet.</div>';
  const hs = pts.map((p) => -p.L); // home-team spread (e.g. PHI -3)
  const lo = Math.min(...hs) - 0.5, hi = Math.max(...hs) + 0.5, W = 300, H = 90, pad = 18;
  const x = (i) => (pts.length === 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (pts.length - 1));
  const y = (v) => 14 + (hi - v) * (H - 34) / (hi - lo || 1);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(hs[i]).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(hs[i]).toFixed(1)}" r="3" fill="#bf5700"/><text x="${x(i).toFixed(1)}" y="${(y(hs[i]) - 6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#2b2b2b">${sp(hs[i])}</text>`).join('');
  const xl = [0, pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).map((i) => `<text x="${x(i).toFixed(1)}" y="${H - 2}" font-size="8" text-anchor="${i ? 'end' : 'start'}" fill="#6e6259">${pts[i].label}</text>`).join('');
  const moved = hs[hs.length - 1] - hs[0];
  const readings = raw.length;
  const note = o === null ? 'Opening line not available' : moved === 0 ? 'Line has not moved since the open' : `Moved ${Math.abs(moved)} pts toward ${moved < 0 ? g.home.abbr : g.away.abbr} ${g.state === 'post' ? 'from open to close' : 'since the open'}`;
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="#bf5700" stroke-width="2"/>${dots}${xl}</svg><div class="cap">${g.home.abbr} spread · ${note}. ${g.state === 'post' ? `Final: ${g.away.abbr} ${g.away.score}, ${g.home.abbr} ${g.home.score}.` : `Tracking starts when this device first sees the game. ${readings} reading${readings === 1 ? '' : 's'} so far${readings < 3 ? ' — by hour and by day look the same until the line moves or more time passes' : ''}.`}</div>`;
}
function lmBlock(g) {
  if (g.line === null) return '';
  const on = LMOPEN.has(g.id);
  return `<button class="lmbtn" data-lm="${g.id}">${on ? '▾' : '📈'} Line movement</button>` + (on ? `<div class="lm"><div class="tg"><button data-lmmode="hour" class="${LMMODE === 'hour' ? 'on' : ''}">By hour</button><button data-lmmode="day" class="${LMMODE === 'day' ? 'on' : ''}">By day</button></div>${lmChart(g)}</div>` : '');
}

function merge(list) { list.forEach((g) => { const old = ALL[g.id]; if (old && g.line === null && old.line !== null) g.line = old.line; ALL[g.id] = g; lmRecord(g); }); }

async function getJson(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

async function loadWeek(n) {
  let list = null;
  try { list = JSON.parse(localStorage.getItem((CFB ? 'cw26-' : 'pw26-') + n)); } catch (e) {}
  if (!list) {
    list = parseEvents(await getJson(SB + 'scoreboard?week=' + n + '&seasontype=2' + SCX), n);
    if (list.length && list.every((g) => g.state === 'post')) { try { localStorage.setItem((CFB ? 'cw26-' : 'pw26-') + n, JSON.stringify(list)); } catch (e) {} }
  }
  merge(list.map((g) => ({ ...g, line: g.line === undefined ? null : g.line })));
}

// Player usage from a finished game's box score (who threw, ran, caught, tackled) — used to tell starters from backups
function parseBox(s) {
  const out = {};
  ((s.boxscore && s.boxscore.teams) || []).forEach((t) => {
    const m = {}; (t.statistics || []).forEach((q) => (m[q.name] = q.displayValue));
    out[ab(t.team.abbreviation)] = { y: parseFloat(m.yardsPerPlay) || 0, to: parseInt(m.turnovers, 10) || 0 };
  });
  if (CFB) return out;
  ((s.boxscore && s.boxscore.players) || []).forEach((p) => {
    const o = (out[ab(p.team.abbreviation)] = out[ab(p.team.abbreviation)] || { y: 0, to: 0 });
    o.qb = {}; o.rb = {}; o.rec = {}; o.def = {};
    p.statistics.forEach((c) => c.athletes.forEach((a) => {
      const id = a.athlete.id, st = a.stats || [];
      if (c.name === 'passing') o.qb[id] = parseInt((st[0] || '').split('/')[1], 10) || 0;
      else if (c.name === 'rushing') o.rb[id] = +st[0] || 0;
      else if (c.name === 'receiving') o.rec[id] = +st[1] || 0;
      else if (c.name === 'defensive') o.def[id] = +st[0] || 0;
    }));
  });
  return out;
}
// Efficiency rating (points): yards-per-play edge and turnover margin over the season, shrunk toward zero
function buildEff() {
  Object.keys(EFF).forEach((k) => delete EFF[k]);
  const tot = {}, n = {};
  Object.values(ALL).forEach((g) => {
    if (g.state !== 'post' || !g.bx) return;
    const h = g.bx[g.home.abbr], a = g.bx[g.away.abbr];
    if (!h || !a || !h.y || !a.y) return;

// Closing line for finished games (ESPN game summary, DraftKings)

const W_MKT = 0.6; // weight on the betting line when one is posted (lines are sharp, and they move with news)

  const hfa = g.neutral ? 0 : HFA;

  const mE = EFF[g.home.abbr] !== undefined && EFF[g.away.abbr] !== undefined ? EFF[g.home.abbr] - EFF[g.away.abbr] + hfa : null;
  let mh = mE === null ? mM : 0.5 * mM + 0.5 * mE;

  const phMkt = g.line === null ? null : Math.min(0.99, Math.max(0.01, Phi(g.line / SD)));
  const ph = phMkt === null ? phModel : W_MKT * phMkt + (1 - W_MKT) * phModel;

const nm = (a) => (CFB ? NAMES[a] || a : M.by[a] ? M.by[a].name : a);

// College strength: margin-based power ratings (capped blowouts, home edge removed), pulled toward an AP-rank prior, rebuilt from every final
function buildRatings() {

  const prior = {}, n = {};
  Object.values(ALL).forEach((g) => [g.home, g.away].forEach((t) => { if (t.rank) prior[t.abbr] = (26 - t.rank) * 0.6; }));
  fin.forEach((g) => { n[g.home.abbr] = (n[g.home.abbr] || 0) + 1; n[g.away.abbr] = (n[g.away.abbr] || 0) + 1; });
  Object.keys(RAT).forEach((k) => delete RAT[k]);
  Object.keys(n).forEach((k) => (RAT[k] = prior[k] || 0));
  const LAM = CFB ? 4 : 3;
  for (let it = 0; it < 25; it++) {
    const sum = {};
    fin.forEach((g) => {
      const d = Math.max(-CAP, Math.min(CAP, g.home.score - g.away.score)) - (g.neutral ? 0 : HFA);
      sum[g.home.abbr] = (sum[g.home.abbr] || 0) + d + RAT[g.away.abbr];
      sum[g.away.abbr] = (sum[g.away.abbr] || 0) - d + RAT[g.home.abbr];

}
const sp = (n) => (n > 0 ? '+' : '') + (Math.abs(n) % 1 ? n.toFixed(1) : n.toFixed(0)); // "+3" or "-2.5"
const byText = (g, m) => (Math.abs(m) < 0.05 ? 'even' : m > 0 ? g.home.abbr + ' by ' + m.toFixed(1) : g.away.abbr + ' by ' + (-m).toFixed(1));

// ---- Locked picks: the pick as it stood just before kickoff, saved on this device, so the record can't use hindsight ----
const lkKey = (id) => 'lk26-' + LG + '-' + id;

  try {
    if (CFB) M = { by: {} };
    else { const [t, l, p] = await Promise.all(['teams', 'lots', 'payouts'].map((n) => getJson('data/' + n + '.json?v=' + Date.now()))); TD = t; LOTS = l; PAY = p; M = Calcutta.compute(t, l, p); }
    await tick();
    const wk = []; for (let n = CFB ? 0 : 1; n <= NWEEKS; n++) wk.push(n);
    let i = 0;
    const w = async () => { while (i < wk.length) { const n = wk[i++]; try { await loadWeek(n); } catch (e) {} render(); } };
    await Promise.all([w(), w(), w()]);
    render();
    loadOdds();
    await fillSpreads(); render(); loadInjuries();
    await fillOpens(); render();
    loadServerLines();
  } catch (e) { $('#upd').textContent = 'Could not load: ' + e.message; }
  BUSY = false;
}
document.addEventListener('toggle', (e) => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.k) DET[d.dataset.k] = d.open; }, true);
document.querySelector('#team').addEventListener('change', (e) => { TEAM = e.target.value; try { localStorage.setItem('pics-team-' + LG, TEAM); } catch (x) {} render(); });
document.querySelectorAll('.lg button').forEach((b) => { if (b.dataset.lg === LG) b.classList.add('on'); });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-lg]'); if (!b || b.dataset.lg === LG) return; try { localStorage.setItem('pics-lg', b.dataset.lg); } catch (x) {} location.reload(); });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-lm],[data-lmmode]');
  if (!b) return;
  if (b.dataset.lmmode) { LMMODE = b.dataset.lmmode; return render(); }
  const id = b.dataset.lm;
  if (LMOPEN.has(id)) LMOPEN.delete(id); else { LMOPEN.add(id); render(); await lmFetchOpen(ALL[id]); }
  render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && M) { tick(); loadOdds(); } });
setInterval(() => { if (M) { loadInjuries(); loadWeek(CUR + 1).then(render).catch(() => {}); fillSpreads().then(render); fillOpens().then(render); loadServerLines(); } }, 30 * 60 * 1000);
loadAll();

if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update().catch(() => {})).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl) { rl = true; location.reload(); } });
}

// Pull down to refresh: wipes the saved app copy and reloads fresh code and data
(function () {
  const bar = document.createElement('div'); bar.id = 'ptr'; document.body.appendChild(bar);
  let y0 = null, d = 0, busy = false;
  const set = (h, t) => { bar.style.height = h + 'px'; bar.textContent = t || ''; };
  window.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && !busy ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (d > 0 && window.scrollY <= 0) set(Math.min(d * 0.5, 70), d > 110 ? 'Release to refresh' : '↓ Pull to refresh'); else set(0);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = d > 110; y0 = null;
    if (!go) return set(0);
    busy = true; set(44, 'Refreshing…');
    try {
      // Refresh data in place (keeps scroll, open weeks, league and team); only reload if a newer app version is out
      const t = await (await fetch('index.html', { cache: 'no-store' })).text();
      const ver = (x) => (/Pics v\d+/.exec(x) || [''])[0];
      if (ver(t) && ver(t) !== ver(document.querySelector('header').innerText)) {
        if ('serviceWorker' in navigator) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
        if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
        const u = new URL(location.href); u.searchParams.set('r', Date.now()); return location.replace(u.toString());
      }
      await tick();
      for (let n = CUR; n <= NWEEKS; n++) { try { await loadWeek(n); } catch (e) {} }
      render();
      await fillSpreads(); render(); loadServerLines(); loadOdds(); INJ_AT = 0; loadInjuries();
    } catch (e) {}
    busy = false; set(0);
  });
})();
</script>
</body>
</html>
