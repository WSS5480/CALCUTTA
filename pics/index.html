    const plays = (parseInt(((m.completionAttempts || '').split('/')[1]), 10) || 0) + (parseInt(m.rushingAttempts, 10) || 0); // college box scores have no yards-per-play

// Live games: ESPN drops the line from the scoreboard at kickoff but the game summary keeps it; fetch it once and cache
const PC = {};
async function fillLive() {
  const todo = Object.values(ALL).filter((g) => g.state === 'in' && g.line === null && !PC[g.id]);
  let i = 0;
  const worker = async () => {
    while (i < todo.length) {
      const g = todo[i++]; let d = null;
      try { d = localStorage.getItem('pc26-' + g.id); } catch (e) {}
      if (d === null) { try { const s = await getJson(SB + 'summary?event=' + g.id); const pc = (s.pickcenter || [])[0]; d = pc ? pc.details || '' : ''; try { localStorage.setItem('pc26-' + g.id, d); } catch (e) {} } catch (e) { continue; } }
      PC[g.id] = true;
      const L = parseLine(d, g.home.abbr, g.away.abbr); if (L !== null) g.line = L;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (todo.length) render();
}
// Closing line for finished games (ESPN game summary, DraftKings)
async function fillSpreads() {
  const todo = Object.values(ALL).filter((g) => g.state === 'post' && g.line === null && !SPREAD[g.id]);
  let i = 0;
  const worker = async () => {
    while (i < todo.length) {
      const g = todo[i++];
      let v = spCache(g.id);
      if (v === null || v === undefined) {
        try {
          const s = await getJson(SB + 'summary?event=' + g.id);
          const pc = (s.pickcenter || [])[0];
          v = { d: pc ? pc.details || '' : '', bx: parseBox(s) };
          spSave(g.id, v);
        } catch (e) { continue; }
      }
      if (v.bx) g.bx = v.bx;
      const L = parseLine(v.d, g.home.abbr, g.away.abbr);
      SPREAD[g.id] = true;
      if (L !== null) g.line = L;
    }
  };

      if (r.p.conf >= 0.65) { HT++; if (r.suHit) HH++; }
      if (r.lk) { LST++; if (r.lsu) LSH++; if (r.lats === 'hit') LAH++; else if (r.lats === 'miss') LAM++; }
      if (r.atsRes === 'hit') { ah++; AH++; } else if (r.atsRes === 'miss') { am++; AM++; } else if (r.atsRes === 'push') { ap++; AP++; }
      const bad = (cls, txt) => `<span class="b ${cls}">${txt}</span>`;
      const b1 = bad(r.suHit ? 'hit' : 'miss', r.suHit ? '✓ Win pick' : '✗ Win pick');
      const b2 = r.atsRes ? bad(r.atsRes, (r.atsRes === 'hit' ? '✓' : r.atsRes === 'miss' ? '✗' : '–') + ' Spread') : '';
      return `<details data-k="g${g.id}" ${isOpen('g' + g.id, false) ? 'open' : ''} class="res ${r.suHit ? 'hit' : 'miss'}"><summary><div class="rtop"><div><b>${g.away.abbr} ${g.away.score} – ${g.home.abbr} ${g.home.score}</b><small>Pick ${r.p.su.abbr} ${pct(r.p.conf)}${r.p.ats ? ` · lean ${r.p.ats.side.abbr} ${sp(r.p.ats.line)}` : ''}</small></div><div class="badges">${b1}${b2}${r.lk ? `<span class="b ${r.lsu ? 'hit' : 'miss'}">🔒 ${r.lsu ? '✓' : '✗'}${r.lats ? ' / ' + (r.lats === 'hit' ? '✓' : r.lats === 'miss' ? '✗' : '–') : ''} Locked</span>` : ''}</div></div></summary>${resDetail(g, r)}${lmBlock(g)}</details>`;
    }).join('');
    return { n, h, t, ah, am, ap, rows };
  });
  const atsN = AH + AM;
  $('#sums').innerHTML = `
    <div class="sum"><b>${ST ? pct(SH / ST, 1) : '–'}</b><span>Win picks (backtest)</span><small>${SH}-${ST - SH}${HT ? ` · 65%+ picks ${HH}-${HT - HH}` : ''}</small></div>
    <div class="sum"><b>${atsN ? pct(AH / atsN, 1) : '–'}</b><span>Spread (backtest)</span><small>${AH}-${AM}${AP ? '-' + AP : ''}${atsN ? '' : ' (loading lines…)'}</small></div>`;

  $('#sums').innerHTML += `
    <div class="sum lock"><b>${LST ? pct(LSH / LST, 1) : '–'}</b><span>🔒 Locked win picks</span><small>${LST ? LSH + '-' + (LST - LSH) : 'counts games picked before kickoff'}</small></div>
    <div class="sum lock"><b>${LAH + LAM ? pct(LAH / (LAH + LAM), 1) : '–'}</b><span>🔒 Locked spread</span><small>${LAH + LAM ? LAH + '-' + LAM : 'starts with the next finished game'}</small></div>`;
  railRender(games, thisWeek); livePageRender(games); navRender();
  $('#list').innerHTML = teamBox(games) + (TEAM ? '' : weekBoard([...thisWeek, ...post.filter((g) => g.week === CUR)]) + titleBoard()) + movesBoard(games) +
    (thisWeek.length ? '<div class="gh">This week</div>' + proj(thisWeek) + (TEAM ? thisWeek.map(card).join('') : '') : (TEAM ? '' : '<div class="note">No more games left this week.</div>')) +
    (Object.keys(future).length ? '<div class="gh">Rest of season</div>' + Object.keys(future).map(Number).sort((a, b) => a - b).map((n) => `<details data-k="f${n}" ${isOpen('f' + n, n === CUR + 1) ? 'open' : ''}><summary>Week ${n}: ${future[n].length} games · exp ${projText(future[n])}</summary>${future[n].map(card).join('')}</details>`).join('') : '') +
    (weeks.length ? '<div class="gh">Results</div>' + weeks.map((w) => `<details data-k="r${w.n}" ${isOpen('r' + w.n, w.n === CUR) ? 'open' : ''}><summary>Week ${w.n}: ${w.h}-${w.t - w.h} picks · spread ${w.ah}-${w.am}${w.ap ? '-' + w.ap : ''}</summary>${w.rows}</details>`).join('') : '');
  const liveN = live.length;
  $('#upd').innerHTML = `<span class="dot ${liveN ? 'on' : ''}"></span>${liveN ? liveN + ' live · ' : ''}updated ${LAST ? LAST.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '…'}`;
  $('#foot').innerHTML = CFB ? 'College football (FBS). Strength is a power rating built from every final this season (blowouts capped at 28, home edge removed) and pulled toward the AP Top 25 rank early on, so it updates after each game. Win chance blends that with the current spread; spread lean compares the model margin with the line. Past games are graded with today\'s ratings, so record is flattering. Line movement logs from the day you first open a game.' : `Starters hurt (ESPN report) are listed for information only. The team model uses this season's score margins and efficiency (yards per play, turnovers) plus home field, then blends with the current spread, so it shifts when the line moves. Spread lean compares the model's expected margin with the DraftKings line (closing line for past games). Past games are graded with today's ratings, so records flatter the model and are not what it would have said before kickoff. ${ODDS_NOTE}`;
}

async function loadOdds() {
  if (CFB || !M || Date.now() - ODDS_AT < 10 * 60 * 1000) return;
  ODDS_AT = Date.now();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 70000);
    const j = await (await fetch(ODDS_URL, { signal: ctl.signal })).json(); clearTimeout(to);
    if (!j.odds) throw new Error();
    TD.teams.forEach((t) => { if (Number.isFinite(j.odds[t.abbr])) t.sbOdds = j.odds[t.abbr]; });
    M = Calcutta.compute(TD, LOTS, PAY);
    ODDS_NOTE = 'Super Bowl odds: ' + (j.book || '') + ' via The Odds API, ' + new Date(j.updated).toLocaleString() + '.';
    render();
  } catch (e) { ODDS_AT = Date.now() - 8 * 60 * 1000; }
}

async function tick() {
  clearTimeout(window.__t);
  try {
    const j = await getJson(SB + 'scoreboard' + (CFB ? '?' + SCX.slice(1) : ''));
    CUR = (j.week && j.week.number) || CUR;
    merge(parseEvents(j, CUR));
    LAST = new Date();
    render();
    liveFetch();
    fillLive();
  } catch (e) { $('#upd').textContent = 'Live scores unavailable · retrying'; }
  const g = Object.values(ALL);
  const hot = g.some((x) => x.state === 'in') || g.some((x) => x.state === 'pre' && x.start - Date.now() < 20 * 60 * 1000 && x.start - Date.now() > -3600e3);
  window.__t = setTimeout(tick, hot ? 60000 : 300000);
}

async function loadAll() {
  if (BUSY) return; BUSY = true;
  try {
    if (CFB) M = { by: {} };
    else { const [t, l, p] = await Promise.all(['teams', 'lots', 'payouts'].map((n) => getJson('data/' + n + '.json?v=' + Date.now()))); TD = t; LOTS = l; PAY = p; M = Calcutta.compute(t, l, p); }
    await loadPrior();
    await tick();
    const wk = []; for (let n = CFB ? 0 : 1; n <= NWEEKS; n++) wk.push(n);
    let i = 0;
    const w = async () => { while (i < wk.length) { const n = wk[i++]; try { await loadWeek(n); } catch (e) {} render(); } };
    await Promise.all([w(), w(), w()]);
    render();
    loadOdds();
    await fillSpreads(); render(); loadInjuries();
    await fillOpens(); render();
    loadServerLines();
  } catch (e) { $('#upd').textContent = 'Could not load: ' + e.message; }
  BUSY = false;
}
document.addEventListener('toggle', (e) => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.k) { DET[d.dataset.k] = d.open; if (d.open && /^(wk|g\d)/.test(d.dataset.k)) liveFetch(); } }, true);
document.querySelector('#tsearch').addEventListener('input', (e) => { teamSelect(); const sel = $('#team'), opts = [...sel.options].filter((o) => o.value); if (e.target.value && opts.length === 1) { sel.value = opts[0].value; TEAM = sel.value; try { localStorage.setItem('pics-team-' + LG, TEAM); } catch (x) {} render(); } else if (!e.target.value && TEAM) { TEAM = ''; sel.value = ''; render(); } });
document.querySelector('#team').addEventListener('change', (e) => { TEAM = e.target.value; try { localStorage.setItem('pics-team-' + LG, TEAM); } catch (x) {} render(); });
document.querySelectorAll('.lg button').forEach((b) => { if (b.dataset.lg === LG) b.classList.add('on'); });
document.addEventListener('click', (e) => { const sp = e.target.closest('[data-sp]'); if (sp) { location.href = 'sports.html?lg=' + sp.dataset.sp; return; } const b = e.target.closest('[data-lg]'); if (!b || b.dataset.lg === LG) return; try { localStorage.setItem('pics-lg', b.dataset.lg); } catch (x) {} location.reload(); });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-lm],[data-lmmode]');
  if (!b) return;
  if (b.dataset.lmmode) { LMMODE = b.dataset.lmmode; return render(); }
  const id = b.dataset.lm;
  if (LMOPEN.has(id)) LMOPEN.delete(id); else { LMOPEN.add(id); render(); await lmFetchOpen(ALL[id]); }
  render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && M) { tick(); loadOdds(); } });
setInterval(() => { if (M) { loadInjuries(); loadWeek(CUR + 1).then(render).catch(() => {}); fillSpreads().then(render); fillOpens().then(render); loadServerLines(); } }, 30 * 60 * 1000);
loadAll();

// Auto-update: when the app comes back to the front (or every 10 minutes) check for a newer version and reload into it
const vnum = (x) => +((/(?:Pics|Oddable) v(\d+)/.exec(x) || [])[1] || 0);
async function checkUpdate() {
  try {
    const t = await (await fetch('index.html?c=' + Date.now(), { cache: 'no-store' })).text();
    if (vnum(t) > vnum(document.querySelector('header').innerText)) {
      if ('serviceWorker' in navigator) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
      if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
      const u = new URL(location.href); u.searchParams.set('r', Date.now()); location.replace(u.toString());
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setTimeout(() => { if (lsg('kal-id')) kalshiSync(false); }, 3000); setTimeout(checkUpdate, 4000); setInterval(checkUpdate, 10 * 60 * 1000);
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update().catch(() => {})).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl) { rl = true; location.reload(); } });
}

// Pull down to refresh: wipes the saved app copy and reloads fresh code and data
(function () {
  const bar = document.createElement('div'); bar.id = 'ptr'; document.body.appendChild(bar);
  let y0 = null, d = 0, busy = false;
  const set = (h, t) => { bar.style.height = h + 'px'; bar.textContent = t || ''; };
  window.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && !busy ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (d > 0 && window.scrollY <= 0) set(Math.min(d * 0.5, 70), d > 110 ? 'Release to refresh' : '↓ Pull to refresh'); else set(0);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = d > 110; y0 = null;
    if (!go) return set(0);
    busy = true; set(44, 'Refreshing…');
    try {
      // Refresh data in place (keeps scroll, open weeks, league and team); only reload if a newer app version is out
      const t = await (await fetch('index.html', { cache: 'no-store' })).text();
      const ver = (x) => (/(?:Pics|Oddable) v(\d+)/.exec(x) || [])[1] || '';
      if (ver(t) && +ver(t) > +ver(document.querySelector('header').innerText)) {
        if ('serviceWorker' in navigator) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
        if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
        const u = new URL(location.href); u.searchParams.set('r', Date.now()); return location.replace(u.toString());
      }
      await tick();
      for (let n = CUR; n <= NWEEKS; n++) { try { await loadWeek(n); } catch (e) {} }
      render();
      await fillSpreads(); render(); loadServerLines(); loadOdds(); INJ_AT = 0; loadInjuries();
    } catch (e) {}
    busy = false; set(0);
  });
})();
</script>
