<script>
const SC = document.getElementById('sc');
// The page scrolls inside #sc so the banner and bottom bar (outside it) can never drift on iOS
try { Object.defineProperty(window, 'scrollY', { get: () => SC.scrollTop, configurable: true }); } catch (e) {}
window.scrollTo = function (a, b) { if (a && typeof a === 'object') SC.scrollTo(a); else SC.scrollTo(0, b || 0); };
const $ = (s) => document.querySelector(s);
const pct = (x, d = 0) => (x * 100).toFixed(d) + '%';
const LG = (() => { try { return localStorage.getItem('pics-lg') === 'cfb' ? 'cfb' : 'nfl'; } catch (e) { return 'nfl'; } })();
const CFB = LG === 'cfb';
const SB = 'https://site.api.espn.com/apis/site/v2/sports/football/' + (CFB ? 'college-football' : 'nfl') + '/';
const SCX = CFB ? '&groups=80&limit=400' : ''; // FBS games only
const NWEEKS = CFB ? 15 : 18;
const NAMES = {}, RAT = {}, EFF = {}, TEAMID = {}, PL = {}, INJ = {};
// Settings from walk-forward backtests: college tuned on 2023-24 and confirmed on 2025 (1,884 games); NFL settings unchanged (no tuned set beat them on the 2025 hold-out)
const HFA = CFB ? 3.5 : 2.0, CAP = CFB ? 100 : 14, DECAY = CFB ? 0.95 : 0.85, RIDGE = CFB ? 1 : 6, MIXM = CFB ? 0.7 : 0.5, CARRY = CFB ? 1 : 0, RKW = CFB ? 1.3 : 0;
const PREV = {}; // last season's final power ratings (college), used as the starting point
const wgt = (g) => Math.pow(DECAY, Math.max(0, (CUR || g.week) - g.week)); // recent games count more
let INJ_AT = 0;
const ODDS_URL = 'https://calcutta-odds.onrender.com/odds';
const FIX = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' };
const PTS = 0.14;
const SD = CFB ? 16 : 12.5; // typical NFL scoring-margin spread around a game's expected margin
const cdf = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }; // logit points per point of margin (about 1 pt = 3.5% win prob near a pick'em)
const DET = {}; // remembers which week sections you opened or closed
const isOpen = (k, dflt) => (k in DET ? DET[k] : dflt);
let TEAM = (() => { try { return localStorage.getItem('pics-team-' + LG) || ''; } catch (e) { return ''; } })();
let LMOPEN = new Set(), LMMODE = 'day', LMBUSY = {};
let TD, LOTS, PAY, M, CUR = 0, ALL = {}, LAST = null, SPREAD = {}, BUSY = false, ODDS_AT = 0, ODDS_NOTE = '';

const ab = (x) => (CFB ? x : FIX[x] || x);
const logit = (x) => Math.log(x / (1 - x));
const spCache = (id) => { try { return JSON.parse(localStorage.getItem('st26-' + id)); } catch (e) { return null; } };
const spSave = (id, v) => { try { localStorage.setItem('st26-' + id, JSON.stringify(v)); } catch (e) {} };

// "SEA -3" / "EVEN" -> home-favored points (positive = home favored), or null
function parseLine(text, home, away) {
  if (!text) return null;
  if (/^(EVEN|PK|PICK)/i.test(text)) return 0;
  const m = /^([A-Z]{2,3})\s+(-?\d+(?:\.\d+)?)$/.exec(text.trim());
  if (!m) return null;
  const fav = ab(m[1]), v = Math.abs(+m[2]);
  return fav === home ? v : fav === away ? -v : null;
}

function parseEvents(j, week) {
  return (j.events || []).map((e) => {
    const c = e.competitions[0], t = e.status.type;
    const cs = c.competitors.map((x) => ({ abbr: ab(x.team.abbreviation), name: x.team.displayName || x.team.location || '', score: parseInt(x.score, 10) || 0, home: x.homeAway === 'home', record: (x.records && x.records[0] && x.records[0].summary) || '', color: x.team.color ? '#' + x.team.color : '', logo: x.team.logo || '', rank: x.curatedRank && x.curatedRank.current > 0 && x.curatedRank.current <= 25 ? x.curatedRank.current : 0 }));
    c.competitors.forEach((x) => { TEAMID[x.team.id] = ab(x.team.abbreviation); NAMES[ab(x.team.abbreviation)] = x.team.shortDisplayName || x.team.displayName || x.team.abbreviation; });
    cs.sort((a, b) => a.home - b.home);
    const o = c.odds && c.odds[0];
    return { id: e.id, week: week || (j.week && j.week.number) || 0, start: +new Date(e.date), state: t.state, detail: t.shortDetail || '', away: cs[0], home: cs[1], neutral: !!c.neutralSite, line: o ? parseLine(o.details, cs[1].abbr, cs[0].abbr) : null, sit: c.situation ? { down: c.situation.down, dist: c.situation.distance, yl: c.situation.yardLine, poss: TEAMID[c.situation.possession] || '', text: (c.situation.lastPlay && c.situation.lastPlay.text) || '', ptxt: c.situation.downDistanceText || '', rz: !!c.situation.isRedZone, wp: c.situation.lastPlay && c.situation.lastPlay.probability && Number.isFinite(c.situation.lastPlay.probability.homeWinPercentage) ? c.situation.lastPlay.probability.homeWinPercentage : null } : null };
  });
}

// ---- Line movement: ESPN gives the opening and current line; we log every change we see on this device ----
const lmKey = (id) => 'lm26-' + id;
const LINES_URL = 'https://raw.githubusercontent.com/WSS5480/CALCUTTA/lines-data/lines.json'; // logged around the clock by a GitHub Action
