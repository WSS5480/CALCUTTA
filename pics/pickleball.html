<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Pickleball v277 (part of Oddable; local-only, points only) -->
<script>try{if(localStorage.getItem('pics-theme')!=='violet')document.documentElement.classList.add('cb')}catch(e){document.documentElement.classList.add('cb')}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball · Oddable</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#041e42">
<style>
:root{--bg:#f6f4fb;--panel:#fff;--panel2:#ece6fb;--line:#d9d0ee;--ink:#2b2b2b;--muted:#5d5873;--blue:#7c3aed;--green:#16915a;--red:#d93a2e}
body.dark{--bg:#0a0c10;--panel:#13161d;--panel2:#1b1f29;--line:#272c38;--ink:#eef0f4;--muted:#8b93a3;--blue:#a78bfa;--green:#4fd18b;--red:#ff5a4d}
html.cb body,html.cb body.dark{--bg:#050c17;--panel:#0b1a30;--panel2:#10264a;--line:#1f3d69;--ink:#f3f6fa;--muted:#9aabbf;--blue:#c6cbd7;--green:#4fd18b;--red:#ff5a4d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px;overflow-wrap:anywhere}
header{position:relative;margin:0 0 6px;padding:max(16px,env(safe-area-inset-top)) max(16px,calc((100% - 688px)/2)) 14px;background:linear-gradient(135deg,#7c3aed 0%,#4c1d95 55%,#1b1f29 100%);border-radius:0 0 26px 26px;color:#fff}
html.cb header{background:linear-gradient(135deg,#003594 0%,#002b5c 38%,#041e42 74%,#08111f 100%);border-bottom:3px solid #869397}
header h1{margin:6px 0 2px;font-size:28px;color:#fff}
header .sub{color:#ede4ff;font-size:13px}html.cb header .sub{color:#c6cbd7}
.home{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font:700 14px system-ui}
main{max-width:720px;margin:0 auto;padding:0 16px}
h2{margin:10px 0 6px;font-size:22px;letter-spacing:-.01em}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;color:inherit;text-decoration:none}
a.card:active,.gm[role=button]:active{opacity:.8}
.card.err,.err{color:var(--red)}.card.err{border-color:var(--red)}.card.ok{border-color:var(--green);color:var(--green)}
.note{color:var(--muted);font-size:13px;margin:8px 0}
.nomoney{margin:10px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--ink)}
.gh{margin:18px 0 6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.gh small{text-transform:none;letter-spacing:0;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row h2{margin:0}
.sub2{color:var(--muted);font-size:13px;margin-top:3px}
.b{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}.b.hit{color:var(--green);border-color:var(--green)}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum{display:block;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;min-width:0}
.sum b{display:block;font-size:22px;line-height:1.2;padding-right:14px}.sum span{display:block;color:var(--muted);font-size:13px}.sum small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sum[data-dr]{cursor:pointer}.sum[data-dr]::after{content:'›';position:absolute;right:12px;top:8px;font-size:22px;opacity:.55}.sum[data-dr]:active{opacity:.75}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btns.two{display:grid;grid-template-columns:1fr 1fr}
.pill{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--blue);background:var(--panel);color:var(--ink);font:700 14px system-ui;cursor:pointer;text-decoration:none}
.pill.pri{background:var(--blue);color:#fff}html.cb .pill.pri{background:#003594;color:#fff;border-color:#c6cbd7}body.dark .pill.pri{color:#0a0c10}html.cb body.dark .pill.pri{color:#fff}
.pill.on{background:var(--panel2);border-width:2px;font-weight:800}html.cb .pill.on{background:#003594;color:#fff}
.pill.dang{border-color:var(--red);color:var(--red)}
.pill.wide{width:100%;margin-top:10px}
.bk{display:inline-flex;align-items:center;min-height:44px;color:var(--blue);font-weight:700;text-decoration:none;margin-top:4px}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font:600 13px system-ui;min-height:36px;cursor:pointer;padding:0 4px}
.frm label,.ged label{display:block;margin:10px 0 0;font-weight:600;font-size:14px}
.frm label small,.lbl small{font-weight:400;color:var(--muted)}
.lbl{margin:14px 0 4px;font-weight:700;font-size:14px}
input,select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 16px system-ui}
textarea{resize:vertical;font-size:15px}
.chk,.frad{display:flex!important;align-items:center;gap:10px;min-height:40px;margin:0!important;cursor:pointer}
.chk input,.frad input{width:22px;height:22px;margin:0;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmts{display:grid;gap:6px}
.fopt{border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin:6px 0}.fopt.on{border-color:var(--blue);background:var(--panel2)}
details.inf{margin:6px 0}details.inf>summary{cursor:pointer;list-style:none;color:var(--blue);font-size:13px;font-weight:600;min-height:36px;display:flex;align-items:center}
details.inf>summary::-webkit-details-marker{display:none}details.inf p{margin:4px 0 8px;font-size:14px;color:var(--ink)}
.gm{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.gm.ready{border-color:var(--blue);cursor:pointer}.gm.open{border-width:2px}.gm.wait{opacity:.7}.gm.auto{opacity:.7;font-size:13px}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}.gl span{font-weight:700}
.gm.ready .gl span{color:var(--blue)}
.gs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0}.gs span{min-width:0}.gs b{font-size:18px;min-width:28px;text-align:right}
.gs.win{font-weight:800;color:var(--green)}.gs.lose{color:var(--muted)}.gs small{color:var(--muted);font-weight:400}
.ged{border-color:var(--blue);margin-top:-4px}.ged label{display:flex;justify-content:space-between;align-items:center;gap:10px}.ged input{flex:none;width:96px;margin:0;font-size:20px;text-align:right}
.byes{color:var(--muted);font-size:13px;margin:6px 2px}
.lrow{display:flex;align-items:center;gap:10px;justify-content:space-between}.lrow span{flex:1;min-width:0}.lrow small{color:var(--muted);font-size:12px}.lrow>b{text-align:right;white-space:nowrap}
.rk{display:inline-block;min-width:26px;color:var(--muted);font-weight:800}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px 10px;margin-top:8px}
.kv span{font-size:12px;color:var(--muted);display:flex;flex-direction:column;text-align:right}.kv span b{font-size:16px;color:var(--ink)}
.st .row small{color:var(--muted)}
.champ{border-color:var(--green);font-size:17px}
.bid .two{margin-top:2px}
.find{display:flex;align-items:center;gap:12px;min-height:64px;margin-top:12px;border:2px solid var(--blue);background:var(--panel2)}
.find .fi{font-size:26px;flex:none}.find .ft{flex:1;min-width:0}.find .ft b{display:block;font-size:17px}.find .ft small{display:block;color:var(--muted);font-size:13px}.find .fgo{flex:none;font-size:26px;opacity:.6}
.cth{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.cth b{flex:1;min-width:0;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tags .b{white-space:normal}
.ctm{margin-top:10px}.src a{color:var(--blue)}
#cf label{display:block}#cf .btns{margin:14px 0 2px}.pill:disabled{opacity:.5;cursor:default}
.foot{color:var(--muted);font-size:12px;margin:24px 0 8px;text-align:center}
/* v265: tablet / desktop widths follow index.html (688px column below 900; from 900 the page fills up to 1168px, 1328px from 1500; 16px side padding). Phones are untouched: every rule sits in a min-width:900px query.
   --rail: index.html keeps a 104px tab rail on the left from 900px. This page has no rail, so it is 0; set it to 104px to line both edges up with index.html pixel for pixel.
   Lists of cards (events, courts, games, standings, players, bids, picks) flow in columns; everything else spans the full row. */
:root{--rail:0px}
@media(min-width:900px){
body{padding-left:var(--rail)}
main{max-width:1200px}
header{padding-left:max(16px,calc((100% - 1168px)/2));padding-right:max(16px,calc((100% - 1168px)/2))}
.sums{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#main,#cres,details.inf[open]{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:14px;align-items:start}
details.inf[open]::details-content{display:contents}
#main>*,#cres>*,details.inf>*{grid-column:1/-1;min-width:0}
#main>a.card.ev,#cres>.card.ct,#main>.gm,details.inf>.gm,#main>.card.st,#main>.card.lrow,#main>.card.bid,#main>.card.pk{grid-column:auto;margin:0 0 14px}
#main>.gh,#cres>.gh,details.inf>.gh{margin-bottom:8px}
#main>.gm.open,details.inf>.gm.open,#main>.gm:has(+ .lnk){grid-column:1/-1;margin-bottom:8px}
#main>a.card.ev,#cres>.card.ct{align-self:stretch}
.pill.wide{max-width:420px}
p.note,div.note:not(.card),details.inf p{max-width:860px}
#main>.card.frm:not(#nf):not(#cf),#main>label.frm,#main>.ged,#main>.gm:has(+ .lnk){max-width:640px}#main>.lnk{justify-self:start}
/* Find local courts: place, distance and the two buttons on one line */
#cf{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;column-gap:14px;align-items:end}
#cf>label[for=cq]{grid-area:1/1}#cf>#cq{grid-area:2/1}#cf>label[for=cr]{grid-area:1/2}#cf>#cr{grid-area:2/2}#cf>.btns{grid-area:2/3;margin:0}#cf>label{margin-top:0}
/* New event: name / date / courts on one line, the six formats and the add-ons three across */
#nf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:14px;align-items:start}
#nf>*{grid-column:1/-1;min-width:0}#nf>label:first-child{grid-column:1/3}#nf>label:first-child+.two{grid-column:3}
#nf>.fmts{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:14px;align-items:start}#nf>.fopt{grid-column:auto}
}
@media(min-width:1500px){
main{max-width:1360px}
header{padding-left:max(16px,calc((100% - 1328px)/2));padding-right:max(16px,calc((100% - 1328px)/2))}
}
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">‹ Oddable</a>
  <h1>🏓 Pickleball</h1>
  <div class="sub">Pools, brackets and side games for your group. Points only, no money.</div>
</header>
<main id="main"></main>
<div class="foot">Oddable v277 · Pickleball · events saved on this device only</div>
<script>try{if(localStorage.getItem('pics-dark')!=='0')document.body.classList.add('dark')}catch(e){document.body.classList.add('dark')}</script>

<script>window.ODD_OPEN_PAGE=true</script><script src="gate.js?v=277"></script>
</body>
