<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcutta 2026</title>
<link rel="icon" href="dive-logo.png">
<style>
:root{
  --bg:#f3f7fd; --panel:#ffffff; --panel2:#e8f0fb; --line:#d3e0f2;
  --ink:#0f2747; --muted:#5b7090; --green:#1f6fe0; --red:#d93a2e; --gold:#b7791f;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
h1{margin:0;font-size:24px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px}
.stat span{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;overflow-x:auto}
nav button{flex:1;min-width:84px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
.sortbar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap;color:var(--muted);font-size:13px}
.sortbar button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.sortbar button.on{color:var(--ink);border-color:var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
.who .lot{color:var(--muted);font-size:12px}
.who .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paid{text-align:right}
.paid b{display:block}
.paid span{color:var(--muted);font-size:12px}
.team{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.team:first-of-type{margin-top:12px}
.tn{font-weight:600}
.tn small{color:var(--muted);font-weight:400;margin-left:6px}
.rec{color:var(--muted);font-size:13px;text-align:right}
.bar{grid-column:1/-1;height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px}
.row3{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.row3 b{color:var(--ink)}
.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.foot div{font-size:12px;color:var(--muted)}
.foot b{display:block;color:var(--ink);font-size:16px}
.pos{color:#16915a!important}.neg{color:var(--red)!important}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.note{color:var(--muted);font-size:12.5px;margin:14px 0}
.note a{color:var(--green)}
.hidden{display:none}
.mini{display:flex;align-items:center;gap:8px}
.mini .av{width:26px;height:26px;font-size:11px}
.livebar{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:8px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.gh{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:16px 0 4px}
.game{padding:12px 14px}
.game.in{border-color:var(--green)}
.gstat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.gstat b{color:var(--ink)}
.gstat .liveTag{color:var(--red);font-weight:700}
.gt{display:flex;align-items:center;gap:10px;padding:6px 0}
.gt .tm{flex:1;min-width:0}
.gt .tm b{display:block;font-size:16px}
.gt .own{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:2px}
.gt .own .av{width:20px;height:20px;font-size:9px}
.gt .sc{font-size:26px;font-weight:700;min-width:40px;text-align:right}
.gt.lose .sc,.gt.lose .tm b{color:var(--muted)}
.gt .tm b small{color:var(--muted);font-weight:400;font-size:12px}
.sit{margin-top:8px;padding:8px 10px;background:var(--panel2);border-radius:10px;font-weight:600;font-size:14px}
.sit .lp{color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}
.sit .liveTag{color:var(--red);font-weight:700}
.cs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12px;color:var(--muted)}.cs b{display:inline;font-size:13px;color:var(--ink);font-weight:700}.cs span{display:inline}
table.ls{margin-top:10px;font-size:13px}
table.ls th{font-size:11px;cursor:default}
table.ls td,table.ls th{text-align:center;padding:5px 4px}
table.ls td:first-child,table.ls th:first-child{text-align:left;font-weight:700}
.gl{grid-column:1/-1;font-size:12.5px;margin-top:4px;color:var(--muted)}
.gl.in{color:var(--ink)}
.gl .liveTag{color:var(--red);font-weight:700;margin-right:6px}
@media (min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.dl{margin-top:10px;background:#fff;color:#1f6fe0;border:1px solid #1f6fe0;border-radius:999px;padding:8px 14px;font:600 14px inherit;cursor:pointer}
[hidden]{display:none!important}
.ibar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:#e8f0fb;border:1px solid #1f6fe0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003}
.ibar span{flex:1;font-size:14px}.ibar button{background:#1f6fe0;color:#fff;border:0;border-radius:999px;padding:8px 14px;font:700 14px inherit;cursor:pointer}.ibar button.x{background:none;color:#fff;padding:8px}
.comb .row3{display:flex;flex-wrap:wrap;gap:4px 14px}.comb .row3 b{margin-left:4px}
.team.comb{background:#e8f0fb;border:1px solid #1f6fe066}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--muted);font-size:13px;line-height:44px;background:var(--bg);position:fixed;top:0;left:0;right:0;z-index:40;transition:height .15s}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f6fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-title" content="Calcutta">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calcutta 2026</h1>
    <div class="sub" id="asof">Loading…</div>
    <div class="sub" id="upd">Live scores: waiting…</div>
    <button id="inst" class="dl">📲 Download App</button> <button id="dl" class="dl">⬇ Download CSV</button>
    <div id="instHelp" class="sub" hidden></div>
  </header>
  <div class="stats" id="stats"></div>
  <nav id="tabs">
    <button data-t="games" class="on">Games</button>
    <button data-t="groups">Groups</button>
    <button data-t="combined">Combined</button>
    <button data-t="buyers">Buyers</button>
    <button data-t="teams">Teams</button>
    <button data-t="payouts">Payouts</button>
  </nav>

  <section id="games">
    <div class="livebar"><span class="dot" id="liveDot"></span><span id="liveText">Loading games…</span></div>
    <div id="gameList"></div>
  </section>

  <section id="groups" class="hidden">
    <div class="sortbar">Sort:
      <button data-s="lot" class="on">Lot #</button>
      <button data-s="pPlayoffs">Playoff %</button>
      <button data-s="pTitle">Title %</button>
      <button data-s="ev">Expected $</button>
      <button data-s="edge">Value</button>
    </div>
    <div id="groupList"></div>
  </section>
  <section id="combined" class="hidden"><div class="sub" style="margin:0 0 8px">Every group with all its teams combined. Tap a column to sort.</div><div class="scroll"><table id="combTable"></table></div></section>
  <section id="buyers" class="hidden"><div id="buyerList"></div></section>
  <section id="teams" class="hidden"><div class="scroll"><table id="teamTable"></table></div></section>
  <section id="payouts" class="hidden"><div id="payoutBody"></div></section>

  <div class="note" id="foot"></div>
</div>

<script src="model.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const pct = (x, d = 0) => (x * 100).toFixed(d) + '%';
const pctSmart = (x) => (x < 0.01 ? (x * 100).toFixed(1) : (x * 100).toFixed(0)) + '%';
const signed = (n) => (n >= 0 ? '+' : '-') + '$' + Math.abs(Math.round(n)).toLocaleString();
const odds = (o) => (o > 0 ? '+' : '') + o.toLocaleString();
const rec = (t) => t.w + '-' + t.l + (t.t ? '-' + t.t : '');
const LOGOS = { Navas: 'dive-logo.png' }; // Navas's groups use The Dive logo

function avatar(name) {
  if (LOGOS[name]) return `<div class="av"><img src="${LOGOS[name]}" alt="${name}"></div>`;
  return `<div class="av">${name.slice(0, 2).toUpperCase()}</div>`;
}

let M, SORT = 'lot', PAY, TD;

function renderStats() {
  const top = [...M.teams].sort((a, b) => b.c - a.c)[0];
  const mostLikelyPlayoffs = M.groups.reduce((a, g) => (g.pPlayoffs > a.pPlayoffs ? g : a));
  $('#stats').innerHTML = `
    <div class="stat"><b>${money(M.pool)}</b><span>Pool</span></div>
    <div class="stat"><b>${M.groups.length}</b><span>Groups</span></div>
    <div class="stat"><b>${money(M.pool * PAY.champion.pct / 100)}</b><span>Champion payout</span></div>
    <div class="stat"><b>${top.abbr} ${pctSmart(top.c)}</b><span>Title favorite</span></div>
    <div class="stat"><b>Lot ${mostLikelyPlayoffs.lot}</b><span>Best playoff odds</span></div>
    <div class="stat"><b>${money(M.pool * PAY.nalgas.pct / 100)}</b><span>Nalgas payout</span></div>`;
  $('#asof').textContent = `Updated ${new Date(TD.updated + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })} · ${TD.asOf}`;
}

function teamBlock(t) {
  return `<div class="team">
    <div class="tn">${t.name}<small>${t.conf}</small></div>
    <div class="rec">${rec(t)} · ${t.pf - t.pa >= 0 ? '+' : ''}${t.pf - t.pa}</div>
    <div class="bar"><i style="width:${Math.max(2, t.m * 100)}%"></i></div>
    <div class="row3"><span>Playoffs <b>${pctSmart(t.m)}</b></span><span>Title <b>${pctSmart(t.c)}</b> (${odds(t.sbOdds)})</span><span>Worst record <b>${pctSmart(t.worst)}</b></span></div>
    ${gameLine(t)}
  </div>`;
}


function combinedBlock(ts, label, pPlay, pTitle) {
  const w = ts.reduce((a, t) => a + t.w, 0), l = ts.reduce((a, t) => a + t.l, 0), tie = ts.reduce((a, t) => a + (t.t || 0), 0);
  const diff = ts.reduce((a, t) => a + t.pf - t.pa, 0);
  const sum = (k) => ts.reduce((a, t) => a + t[k], 0);
  return `<div class="team comb">
    <div class="tn">${label}<small>${ts.length} team${ts.length > 1 ? 's' : ''}: ${ts.map((t) => t.abbr).join(' + ')}</small></div>
    <div class="rec">${w}-${l}${tie ? '-' + tie : ''} · ${diff >= 0 ? '+' : ''}${diff}</div>
    <div class="row3"><span>Playoffs (any) <b>${pctSmart(pPlay)}</b></span><span>Avg teams in <b>${sum('m').toFixed(2)}</b></span><span>Title <b>${pctSmart(pTitle)}</b></span><span>Reach SB <b>${pctSmart(sum('a3'))}</b></span><span>Worst record <b>${pctSmart(sum('worst'))}</b></span></div>
  </div>`;
}

function renderGroups() {
  const arr = [...M.groups];
  if (SORT === 'lot') arr.sort((a, b) => a.lot - b.lot);
  else arr.sort((a, b) => b[SORT] - a[SORT]);
  $('#groupList').innerHTML = arr.map((g) => `
    <div class="card">
      <div class="top">${avatar(g.buyer)}
        <div class="who"><div class="lot">Lot ${g.lot}</div><div class="name">${g.buyer}</div></div>
        <div class="paid"><b>${money(g.paid)}</b><span>${pct(g.paidShare, 1)} of pool</span></div>
      </div>
      ${g.ts.map(teamBlock).join('')}
      ${combinedBlock(g.ts, 'Combined group', g.pPlayoffs, g.pTitle)}
      <div class="foot">
        <div>Expected payout<b>${money(g.ev)}</b></div>
        <div>Value vs paid<b class="${g.edge >= 0 ? 'pos' : 'neg'}">${signed(g.edge)}</b></div>
        <div>Win title<b>${pctSmart(g.pTitle)}</b></div>
      </div>
    </div>`).join('');
}

function renderBuyers() {
  const arr = [...M.buyers].sort((a, b) => b.paid - a.paid);
  $('#buyerList').innerHTML = arr.map((b) => `
    <div class="card">
      <div class="top">${avatar(b.name)}
        <div class="who"><div class="name">${b.name}</div><div class="lot">${b.groups.length} group${b.groups.length > 1 ? 's' : ''}: lots ${b.groups.map((g) => g.lot).join(', ')}</div></div>
        <div class="paid"><b>${money(b.paid)}</b><span>${pct(b.paid / M.pool, 1)} of pool</span></div>
      </div>
      <div class="foot">
        <div>Expected payout<b>${money(b.ev)}</b></div>
        <div>Value vs paid<b class="${b.edge >= 0 ? 'pos' : 'neg'}">${signed(b.edge)}</b></div>
        <div>Win title<b>${pctSmart(b.pTitle)}</b></div>
      </div>
      ${combinedBlock(b.groups.flatMap((g) => g.ts), 'Combined teams', b.pPlayoffs, b.pTitle)}
    </div>`).join('');
}


let CSORT = 'ev';
function renderCombined() {
  const arr = M.groups.map((g) => ({ g, lot: g.lot, paid: g.paid, ev: g.ev, edge: g.edge, pPlayoffs: g.pPlayoffs, pTitle: g.pTitle, pSB: g.pSB, pWorst: g.pWorst }))
    .sort((a, b) => b[CSORT] - a[CSORT] || a.lot - b.lot);
  if (CSORT === 'lot') arr.sort((a, b) => a.lot - b.lot);
  const th = (k, l) => `<th data-k="${k}">${l}${CSORT === k ? ' ▾' : ''}</th>`;
  const tot = (k) => arr.reduce((a, r) => a + r[k], 0);
  $('#combTable').innerHTML = `<tr>${th('lot', 'Lot')}<th>Owner</th><th>Teams</th><th>Rec</th>${th('paid', 'Paid')}${th('ev', 'Exp $')}${th('edge', 'Value')}${th('pPlayoffs', 'Playoffs')}${th('pTitle', 'Title')}${th('pSB', 'Reach SB')}${th('pWorst', 'Worst')}</tr>` +
    arr.map(({ g }) => {
      const w = g.ts.reduce((a, t) => a + t.w, 0), l = g.ts.reduce((a, t) => a + t.l, 0), tt = g.ts.reduce((a, t) => a + (t.t || 0), 0);
      return `<tr><td>${g.lot}</td><td><span class="mini">${avatar(g.buyer)}${g.buyer}</span></td><td>${g.teams.join(' + ')}</td><td>${w}-${l}${tt ? '-' + tt : ''}</td><td>${money(g.paid)}</td><td>${money(g.ev)}</td><td class="${g.edge >= 0 ? 'pos' : 'neg'}">${signed(g.edge)}</td><td>${pctSmart(g.pPlayoffs)}</td><td>${pctSmart(g.pTitle)}</td><td>${pctSmart(g.pSB)}</td><td>${pctSmart(g.pWorst)}</td></tr>`;
    }).join('') +
    `<tr><td colspan="4"><b>Total</b></td><td><b>${money(tot('paid'))}</b></td><td><b>${money(tot('ev'))}</b></td><td></td><td></td><td><b>${pctSmart(tot('pTitle'))}</b></td><td></td><td><b>${pctSmart(tot('pWorst'))}</b></td></tr>`;
  document.querySelectorAll('#combTable th[data-k]').forEach((h) => (h.onclick = () => { CSORT = h.dataset.k; renderCombined(); }));
}

let TSORT = 'm';
function renderTeams() {
  const owner = {};
  M.groups.forEach((g) => g.teams.forEach((a) => (owner[a] = g)));
  const arr = [...M.teams].sort((a, b) => (TSORT === 'name' ? a.name.localeCompare(b.name) : b[TSORT] - a[TSORT]));
  const th = (k, l) => `<th data-k="${k}">${l}${TSORT === k ? ' ▾' : ''}</th>`;
  $('#teamTable').innerHTML = `<tr>${th('name', 'Team')}<th>Owner</th>${th('w', 'Rec')}${th('m', 'Playoffs')}${th('c', 'Title')}${th('a3', 'Reach SB')}${th('worst', 'Worst')}${th('ev', 'Exp $')}</tr>` +
    arr.map((t) => `<tr><td>${t.name}</td><td><span class="mini">${avatar(owner[t.abbr].buyer)}${owner[t.abbr].buyer}</span></td><td>${rec(t)}</td><td>${pctSmart(t.m)}</td><td>${pctSmart(t.c)}</td><td>${pctSmart(t.a3)}</td><td>${pctSmart(t.worst)}</td><td>${money(t.ev)}</td></tr>`).join('');
  document.querySelectorAll('#teamTable th[data-k]').forEach((h) => (h.onclick = () => { TSORT = h.dataset.k; renderTeams(); }));
}

function renderPayouts() {
  const rows = [
    ['nalgas', 'Nalgas (worst record in NFL)', 1],
    ['wildCard', 'Wild Card win', PAY.wildCard.games],
    ['divisional', 'Divisional win', PAY.divisional.games],
    ['conference', 'Conference win', PAY.conference.games],
    ['sbLoser', 'Super Bowl loser', 1],
    ['champion', 'Super Bowl champion', 1],
  ];
  $('#payoutBody').innerHTML = `<div class="card"><table>
    <tr><th>Prize</th><th>Share</th><th>Each</th><th>Total</th></tr>
    ${rows.map(([k, l, n]) => {
      const total = M.pool * PAY[k].pct / 100;
      return `<tr><td>${l}${n > 1 ? ` <span class="sub">×${n}</span>` : ''}</td><td>${(PAY[k].pct / n).toFixed(2)}%</td><td>${money(total / n)}</td><td>${money(total)}</td></tr>`;
    }).join('')}
    <tr><td><b>Total</b></td><td></td><td></td><td><b>${money(M.pool)}</b></td></tr></table></div>
    <div class="note">Each group's expected payout adds up what its teams are likely to win under this structure. The wild-card prize is 10% split across 6 games (1.67% each, shown as 1.66% on the sheet).</div>`;
}

function renderFoot() {
  $('#foot').innerHTML = `<b>How the numbers work.</b> Playoff % comes from prediction-market prices (${TD.sources.playoffPct}). Title % is the Super Bowl odds with the sportsbook margin removed (${TD.sources.sbOdds}). Records: ${TD.sources.records}.
    Chances to win each playoff round and the "worst record" odds are estimates built from those numbers, so treat them as a guide, not a guarantee. Lot 14 (Chiefs) is entered as $10,000.`;
}

/* ---------- Live games (ESPN scoreboard, refreshed every minute during games) ---------- */
const SCORES_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const ABBR_FIX = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' };
let GAMES = [], GAME_BY = {}, LAST_OK = null, TICK = null;

function parseGames(j) {
  const evs = j.events || (j.leagues && j.leagues[0] && j.leagues[0].events) || [];
  return evs.map((e) => {
    const c = (e.competitions || [])[0] || {};
    const st = e.status || c.status || {};
    const ty = st.type || {};
    const comp = (c.competitors || []).map((x) => {
      const a = x.team && x.team.abbreviation;
      return {
        abbr: ABBR_FIX[a] || a, id: String(x.id || (x.team && x.team.id) || ''), score: parseInt(x.score, 10) || 0,
        home: x.homeAway === 'home', winner: !!x.winner,
        record: (x.records && x.records[0] && x.records[0].summary) || '',
        ls: (x.linescores || []).map((l) => l.value),
      };
    });
    comp.sort((a, b) => a.home - b.home); // away first
    const o = c.odds && c.odds[0];
    return {
      id: e.id, start: new Date(e.date), state: ty.state, detail: ty.shortDetail || ty.detail || '', comp,
      sit: c.situation || null, odds: o ? (o.details || '') + (o.overUnder ? ', O/U ' + o.overUnder : '') : '',
    };
  }).filter((g) => g.comp.length === 2);
}

function ownerOf(abbr) {
  const g = M.groups.find((x) => x.teams.includes(abbr));
  return g ? { buyer: g.buyer, lot: g.lot, paid: g.paid, gev: g.ev } : null;
}

function gameLine(t) {
  const g = GAME_BY[t.abbr];
  if (!g) return '';
  const [a, h] = g.comp;
  const score = `${a.abbr} ${a.score} – ${h.abbr} ${h.score}`;
  if (g.state === 'in') return `<div class="gl in"><span class="liveTag">LIVE</span>${score} · ${g.detail}</div>`;
  if (g.state === 'post') return `<div class="gl">Final · ${score}</div>`;
  return `<div class="gl">${g.start.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })} · ${a.abbr} at ${h.abbr}</div>`;
}

function renderGames() {
  const live = GAMES.filter((g) => g.state === 'in');
  const pre = GAMES.filter((g) => g.state === 'pre').sort((a, b) => a.start - b.start);
  const post = GAMES.filter((g) => g.state === 'post').sort((a, b) => b.start - a.start);
  const lineScore = (g) => {
    if (g.state === 'pre') return '';
    const n = Math.max(4, ...g.comp.map((x) => x.ls.length));
    const head = Array.from({ length: n }, (_, k) => `<th>${k < 4 ? k + 1 : 'OT'}</th>`).join('');
    const rows = g.comp.map((x) => `<tr><td>${x.abbr}</td>${Array.from({ length: n }, (_, k) => `<td>${x.ls[k] !== undefined ? x.ls[k] : '-'}</td>`).join('')}<td><b>${x.score}</b></td></tr>`).join('');
    return `<table class="ls"><tr><th></th>${head}<th>T</th></tr>${rows}</table>`;
  };
  const card = (g) => {
    const [a, h] = g.comp;
    const mx = Math.max(a.score, h.score);
    const poss = g.state === 'in' && g.sit && g.sit.possession ? String(g.sit.possession) : '';
    const row = (x) => {
      const o = ownerOf(x.abbr);
      const name = (M.by[x.abbr] || { name: x.abbr }).name;
      const lose = g.state === 'post' && x.score < mx;
      return `<div class="gt ${lose ? 'lose' : ''}"><div class="tm"><b>${name}${poss && poss === x.id ? ' 🏈' : ''}<small> ${x.record}</small></b>${o ? `<div class="own">${avatar(o.buyer)}${o.buyer} · Lot ${o.lot} · paid ${money(o.paid)}</div>` : ''}${(() => { const t = M.by[x.abbr]; return t ? `<div class="cs"><span>Playoffs <b>${pctSmart(t.m)}</b></span><span>Title <b>${pctSmart(t.c)}</b></span><span>EV <b>${money(t.ev)}</b></span></div>` : ''; })()}</div>${g.state === 'pre' ? '' : `<div class="sc">${x.score}</div>`}</div>`;
    };
    const status = g.state === 'in' ? `<span><span class="liveTag">LIVE</span> <b>${g.detail}</b></span><span>${g.odds}</span>`
      : g.state === 'post' ? `<b>${g.detail || 'Final'}</b><span>${g.odds}</span>`
      : `<b>${g.start.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</b><span>${g.odds}</span>`;
    const sit = g.state === 'in' && g.sit
      ? `<div class="sit">${g.sit.downDistanceText || g.sit.shortDownDistanceText || (g.sit.down > 0 ? ['', '1st', '2nd', '3rd', '4th'][g.sit.down] + ' & ' + g.sit.distance : '')}${g.sit.isRedZone ? ' · <span class="liveTag">Red zone</span>' : ''}${g.sit.lastPlay && g.sit.lastPlay.text ? `<div class="lp">${g.sit.lastPlay.text}</div>` : ''}</div>` : '';
    return `<div class="card game ${g.state}"><div class="gstat">${status}</div>${row(a)}${row(h)}${sit}${lineScore(g)}</div>`;
  };
  const sect = (title, arr) => (arr.length ? `<div class="gh">${title}</div>${arr.map(card).join('')}` : '');
  $('#gameList').innerHTML = GAMES.length
    ? sect('Live now', live) + sect('Upcoming', pre) + sect('Final', post)
    : '<div class="note">No games on the scoreboard right now.</div>';
  const dot = $('#liveDot');
  dot.classList.toggle('on', live.length > 0);
  const when = LAST_OK ? LAST_OK.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '';
  $('#liveText').textContent = live.length
    ? `${live.length} game${live.length > 1 ? 's' : ''} live · updates every minute · ${when}`
    : `No games live · checking every 5 min · ${when}`;
}

function nextDelay() {
  const live = GAMES.some((g) => g.state === 'in');
  const soon = GAMES.some((g) => g.state === 'pre' && g.start - Date.now() < 20 * 60 * 1000);
  return live || soon ? 60 * 1000 : 5 * 60 * 1000;
}

async function tickGames() {
  clearTimeout(TICK);
  try {
    const r = await fetch(SCORES_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    GAMES = parseGames(await r.json());
    GAME_BY = {};
    GAMES.forEach((g) => g.comp.forEach((c) => (GAME_BY[c.abbr] = g)));
    LAST_OK = new Date();
    $('#upd').textContent = '● Live scores updated ' + LAST_OK.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    renderGames();
    renderGroups();
  } catch (e) {
    $('#upd').textContent = LAST_OK ? 'Live scores last updated ' + LAST_OK.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) + ' (retrying)' : 'Live scores unavailable (retrying)';
    $('#liveText').textContent = 'Live scores unavailable (' + e.message + ') · retrying every minute';
  }
  TICK = setTimeout(tickGames, GAMES.length ? nextDelay() : 60 * 1000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && M) tickGames(); });

document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['games', 'groups', 'combined', 'buyers', 'teams', 'payouts'].forEach((id) => $('#' + id).classList.toggle('hidden', id !== b.dataset.t));
  window.scrollTo({ top: 0 });
}));
document.querySelectorAll('.sortbar button').forEach((b) => (b.onclick = () => {
  SORT = b.dataset.s;
  document.querySelectorAll('.sortbar button').forEach((x) => x.classList.toggle('on', x === b));
  renderGroups();
}));

function loadAll() {
  return Promise.all(['teams', 'lots', 'payouts'].map((n) => fetch('data/' + n + '.json?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.json())))
    .then(([t, l, p]) => {
      TD = t; PAY = p;
      M = Calcutta.compute(t, l, p);
      renderStats(); renderGroups(); renderCombined(); renderBuyers(); renderTeams(); renderPayouts(); renderFoot(); return tickGames();
    })
    .catch((e) => { $('#asof').textContent = 'Could not load data: ' + e.message; });
}
loadAll();

// Pull down to refresh
(function () {
  const bar = document.createElement('div');
  bar.id = 'ptr';
  document.body.appendChild(bar);
  let y0 = null, d = 0, busy = false;
  const set = (h, txt) => { bar.style.height = h + 'px'; bar.textContent = txt || ''; };
  window.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && !busy ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (d > 0 && window.scrollY <= 0) set(Math.min(d * 0.5, 70), d > 110 ? 'Release to refresh' : '↓ Pull to refresh');
    else set(0);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = d > 110; y0 = null;
    if (!go) return set(0);
    busy = true; set(44, 'Refreshing…');
    await loadAll();
    try { const r = await fetch('sw.js', { cache: 'no-store' }); } catch (e) {}
    busy = false; set(0);
  });
})();

function csvCell(v){ v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(){
  const rows = [['Lot','Buyer','Teams','Paid','Expected payout','Edge $','Edge %','Playoffs %','Title %','Super Bowl %','Worst record %']];
  M.groups.forEach((g) => rows.push([g.lot, g.buyer, g.teams.join('/'), g.paid, Math.round(g.ev), Math.round(g.edge), (g.edgePct*100).toFixed(1), (g.pPlayoffs*100).toFixed(1), (g.pTitle*100).toFixed(1), (g.pSB*100).toFixed(1), (g.pWorst*100).toFixed(1)]));
  rows.push([]);
  rows.push(['Team','Record','Playoffs %','Title %','Super Bowl %','Expected payout','Owner','Lot']);
  M.teams.slice().sort((x, y) => y.ev - x.ev).forEach((t) => { const o = ownerOf(t.abbr) || {}; rows.push([t.name, t.w + '-' + t.l + (t.t ? '-' + t.t : ''), (t.m*100).toFixed(1), (t.c*100).toFixed(1), (t.a3*100).toFixed(1), Math.round(t.ev), o.buyer || '', o.lot || '']); });
  const blob = new Blob([rows.map((r) => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'calcutta-2026.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('dl').addEventListener('click', downloadCsv);

let DEFER=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();DEFER=e;});
window.addEventListener('appinstalled',()=>{$('#inst').hidden=true;});
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('#inst').hidden=true;
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
}
$('#inst').addEventListener('click', async () => {
  const h=$('#instHelp');
  if (DEFER) { DEFER.prompt(); await DEFER.userChoice; DEFER=null; return; }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  h.textContent = ios ? 'On iPhone: tap the Share button in Safari, then "Add to Home Screen".' : 'Open your browser menu (⋮) and tap "Install app" or "Add to Home screen".';
  h.hidden=false;
});

(function(){
  let seen=false; try{seen=localStorage.getItem('instDismissed')==='1';}catch(e){}
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(seen||standalone) return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  function show(){
    if(document.getElementById('ibar')) return;
    const d=document.createElement('div'); d.className='ibar'; d.id='ibar';
    d.innerHTML='<span>'+(ios?'Install Calcutta: tap <b>Share</b> then <b>Add to Home Screen</b>':'Install Calcutta as an app')+'</span>'+(ios?'':'<button id="ibGo">Install</button>')+'<button class="x" id="ibX">✕</button>';
    document.body.appendChild(d);
    const close=()=>{d.remove();try{localStorage.setItem('instDismissed','1');}catch(e){}};
    document.getElementById('ibX').onclick=close;
    const go=document.getElementById('ibGo'); if(go) go.onclick=async()=>{ if(DEFER){DEFER.prompt();await DEFER.userChoice;DEFER=null;} close(); };
  }
  window.addEventListener('beforeinstallprompt',()=>setTimeout(show,1500));
  if(ios) setTimeout(show,3000);
})();
</script>
